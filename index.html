              <label class="field${bankFieldClass("fromDate")}">
                <span class="field-label"><span>${text.from} <span class="req">*</span></span></span>
                <input name="fromDate" type="date" max="${fromMax}" value="${escapeHtml(draft.fromDate)}" />
              </label>
              <label class="field${bankFieldClass("toDate")}">
                <span class="field-label"><span>${text.to} <span class="req">*</span></span></span>
                <input name="toDate" type="date" max="${yesterday}" value="${escapeHtml(draft.toDate)}" />
              </label>
              <label class="field">
                <span class="field-label"><span>${text.balance}</span></span>
                <input value="${escapeHtml(balanceValue)}" readonly />
              </label>
              <label class="field">
                <span class="field-label"><span>${text.charges}</span></span>
                <input value="${money(SERVICE_CHARGE, "MMK")}" readonly />
              </label>
              <label class="field span-2${bankFieldClass("chargeAccount")}">
                <span class="field-label"><span>${text.feeAccount} <span class="req">*</span></span></span>
                <select name="chargeAccount" ${feeDisabled ? "disabled" : ""}>
                  <option value="">${text.selectFee}</option>
                  ${feeChoices}
                </select>
                <p class="hint">${feeHint}</p>
              </label>
              <label class="field span-2">
                <span class="field-label"><span>${text.remark}</span><span class="char-count" id="bank-remark-count">${draft.remark.length}/200</span></span>
                <textarea name="remark" maxlength="200" placeholder="${escapeHtml(text.remarkPh)}">${escapeHtml(draft.remark)}</textarea>
              </label>
              <div class="embassy-actions span-2">
                <button class="send-btn full-btn" type="submit" ${bankInquiryBlocked() ? "disabled" : ""}>${text.inquiry}</button>
                <button class="text-btn full-btn" type="button" id="bank-cancel">${text.cancel}</button>
              </div>
            </form>
          </article>
        </section>`;
    }

    function agreeHtml(inputId, termsId, text, checked) {
      const amount = money(SERVICE_CHARGE, "MMK");
      const [beforeTerms, afterTerms = ""] = text.agree.split("{terms}");
      const [beforeAmount, afterAmount = ""] = afterTerms.split("{amount}");
      return `<div class="agree-box">
        <input id="${inputId}" type="checkbox" ${checked ? "checked" : ""} />
        <p>
          <label for="${inputId}">${escapeHtml(beforeTerms)}</label><button class="agree-link" id="${termsId}" type="button">${escapeHtml(text.agreeTerms)}</button><label for="${inputId}">${escapeHtml(beforeAmount)}<strong class="agree-amount">${escapeHtml(amount)}</strong>${escapeHtml(afterAmount)}</label>
        </p>
      </div>`;
    }

    function openTerms(text) {
      const amount = money(SERVICE_CHARGE, "MMK");
      document.getElementById("terms-title").textContent = text.agreeTerms;
      document.getElementById("terms-copy").textContent = text.agree
        .replace("{terms}", text.agreeTerms)
        .replace("{amount}", amount);
      document.getElementById("terms-close").textContent = t().close;
      document.getElementById("terms-dialog").showModal();
    }

    function bindAgreement(inputId, buttonId, termsId, agreedKey, text) {
      const input = document.getElementById(inputId);
      const button = document.getElementById(buttonId);
      const terms = document.getElementById(termsId);
      if (!input || !button) return;
      input.addEventListener("change", () => {
        state[agreedKey] = input.checked;
        button.disabled = !input.checked;
      });
      if (terms) {
        terms.addEventListener("click", (event) => {
          event.preventDefault();
          event.stopPropagation();
          openTerms(text);
        });
      }
    }

    function bankConfirm() {
      const text = bankCopy();
      const draft = state.bankDraft;
      const primary = accountById(draft.account);
      const charge = resolvedCharge(draft);
      const rows = [
        [text.account, primary ? `${primary.number} (${primary.currency})` : ""],
        [text.name, primary ? primary.name : ""],
        [text.from, formatIso(draft.fromDate)],
        [text.to, formatIso(draft.toDate)],
        [text.balance, primary && draft.toDate ? money(primary.eoc, primary.currency) : ""],
        [text.charges, money(SERVICE_CHARGE, "MMK")],
        [text.feeAccount, charge ? `${charge.number} (${charge.currency})` : ""],
        [text.remark, draft.remark.trim() || "—"]
      ];
      const list = rows.map(([label, value]) =>
        `<div class="confirm-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value)}</strong></div>`
      ).join("");
      return `
        <section class="embassy embassy-center">
          <div class="page-top">${backButton("bank-confirm-back")}</div>
          <article class="send-card">
            <div class="confirm-head">
              <h1>${text.confirmTitle}</h1>
              <button class="icon-btn" type="button" id="bank-confirm-edit">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3z"/><path d="m13.5 6.5 3 3"/></svg>

            ${primary ? bankFilePreviewHtml(primary, draft) : ""}

              <button class="send-btn full-btn" type="button" id="bank-confirm-apply" ${state.bankAgreed ? "" : "disabled"}>${text.apply}</button>
            </div>

    function syncBankDraftFromForm(form) {
      const data = new FormData(form);
      const draft = state.bankDraft;
      draft.account = data.get("account") || "";
      draft.fromDate = data.get("fromDate") || "";
      draft.toDate = data.get("toDate") || "";
      draft.remark = String(data.get("remark") || "").slice(0, 200);
      const primary = accountById(draft.account);
      if (primary && primary.type === "LCY") draft.chargeAccount = primary.id;
      else draft.chargeAccount = data.get("chargeAccount") || "";
    }

    function validateBankInquiry() {
      const draft = state.bankDraft;
      const errors = {};
      const alerts = [];
      const yesterday = yesterdayIso();
      if (!draft.account) errors.account = true;
      if (!draft.fromDate) errors.fromDate = true;
      if (!draft.toDate) errors.toDate = true;
      const charge = resolvedCharge(draft);
      if (!charge) errors.chargeAccount = true;
      if (Object.keys(errors).length) alerts.push("msg007");
      if (draft.toDate && draft.toDate > yesterday) {
        errors.toDate = true;
        alerts.push("toRule");
      }
      if (draft.fromDate && (draft.fromDate > yesterday || (draft.toDate && draft.fromDate > draft.toDate))) {
        errors.fromDate = true;
        if (draft.toDate && draft.fromDate > draft.toDate) errors.toDate = true;
        alerts.push("dateOrder");
      }
      if (charge) {
        bankChargeIssues(charge).forEach((key) => {
          errors.chargeAccount = true;
          alerts.push(key);
        });
      }
      state.bankFieldErrors = errors;
      state.bankAlerts = alerts;
      return alerts.length === 0;
    }

    function bankOtp(text) {
      text = text || bankCopy();
      const digits = String(state.otpCode || "").replace(/\D/g, "").slice(0, 6).split("");
      const boxes = Array.from({ length: 6 }, (_, index) => {
        const value = digits[index] || "";
        return `<input class="otp-digit" inputmode="numeric" maxlength="1" autocomplete="${index === 0 ? "one-time-code" : "off"}" aria-label="${escapeHtml(text.otpDigit)} ${index + 1}" value="${escapeHtml(value)}" />`;
      }).join("");
      const errorText = state.otpError === "wrong" ? text.otpWrong : text.otpCodeRequired;
      const error = state.otpError
        ? `<p class="auth-error" id="otp-code-error">${escapeHtml(errorText.replace("{otp}", DEMO_OTP))}</p>`
        : `<p class="auth-error" id="otp-code-error" hidden></p>`;
      const left = otpSecondsLeft();
      const resent = state.otpResent
        ? `<p class="otp-resent" id="otp-resent">${escapeHtml(text.otpResent)}</p>`
        : `<p class="otp-resent" id="otp-resent" hidden></p>`;

              <div class="otp-timeout">
                <p class="otp-count" id="otp-count">${escapeHtml(text.otpTimeout.replace("{seconds}", String(left)))}</p>
                <button class="otp-resend" id="otp-resend" type="button" ${left > 0 ? "disabled" : ""}>${escapeHtml(text.otpResend)}</button>
              </div>
              ${resent}
              ${error}

              </div>
            </form>
          </article>
        </section>`;

    function bindBankOtp() {
      const boxes = [...document.querySelectorAll(".otp-digit")];
      const error = document.getElementById("otp-code-error");
      const text = bankCopy();
      const hideError = () => {
        state.otpError = "";
        state.otpResent = false;
        document.getElementById("otp-digits").classList.remove("invalid");
        error.hidden = true;
        const note = document.getElementById("otp-resent");
        if (note) note.hidden = true;
      };
      document.getElementById("otp-back").addEventListener("click", () => {
        clearOtp();
        state.bankView = "auth";
        render();
      });
      boxes.forEach((box, index) => {
        box.addEventListener("input", () => {
          const digit = box.value.replace(/\D/g, "").slice(-1);
          box.value = digit;
          state.otpCode = readOtpDigits(boxes);
          hideError();
          if (digit && boxes[index + 1]) boxes[index + 1].focus();
        });
        box.addEventListener("keydown", (event) => {
          if (event.key === "Backspace" && !box.value && boxes[index - 1]) {
            boxes[index - 1].value = "";
            boxes[index - 1].focus();
            state.otpCode = readOtpDigits(boxes);
            hideError();
          }
          if (event.key === "ArrowLeft" && boxes[index - 1]) boxes[index - 1].focus();
          if (event.key === "ArrowRight" && boxes[index + 1]) boxes[index + 1].focus();
        });
        box.addEventListener("paste", (event) => {
          event.preventDefault();
          const pasted = (event.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
          pasted.split("").forEach((digit, digitIndex) => {
            if (boxes[digitIndex]) boxes[digitIndex].value = digit;
          });
          state.otpCode = readOtpDigits(boxes);
          hideError();
          const next = boxes[Math.min(pasted.length, boxes.length - 1)];
          if (next) next.focus();
        });
      });
      document.getElementById("otp-resend").addEventListener("click", () => {
        if (otpSecondsLeft() > 0) return;
        state.otpDeadline = Date.now() + OTP_TIMEOUT * 1000;
        state.otpCode = "";
        state.otpError = "";
        state.otpResent = true;
        boxes.forEach((box) => { box.value = ""; });
        document.getElementById("otp-digits").classList.remove("invalid");
        error.hidden = true;
        const note = document.getElementById("otp-resent");
        note.hidden = false;
        note.textContent = text.otpResent;
        startOtpTimer();
        boxes[0].focus();
      });
      document.getElementById("otp-code-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const code = readOtpDigits(boxes);
        state.otpCode = code;
        if (code.length < 6) {
          state.otpError = "required";
          render();
          return;
        }
        if (code !== DEMO_OTP) {
          state.otpError = "wrong";
          render();
          return;
        }
        const channel = state.otpChannel;
        clearOtp();
        sendBankStatement(channel);
      });
      if (!state.otpDeadline) state.otpDeadline = Date.now() + OTP_TIMEOUT * 1000;
      startOtpTimer();
      const firstEmpty = boxes.find((box) => !box.value) || boxes[0];
      if (firstEmpty) firstEmpty.focus();
    }

    function nextBankReference() {
      const max = state.bankHistory.reduce((highest, item) => {
        const match = String(item.reference || "").match(/^BS-(\d+)$/);
        return match ? Math.max(highest, Number(match[1])) : highest;
      }, 0);
      return `BS-${String(max + 1).padStart(3, "0")}`;
    }

    function bankApplicationKey(item) {
      return [item.accountNumber || "", item.fromDate || "", item.toDate || ""].join("|");
    }

    function sendBankStatement(channel) {
      const draft = state.bankDraft;
      const primary = accountById(draft.account);
      const charge = resolvedCharge(draft);
      if (!primary || !charge) return;
      const sentAt = new Date().toISOString();
      const accountNumber = `${primary.number} (${primary.currency})`;
      const key = bankApplicationKey({ accountNumber, fromDate: draft.fromDate, toDate: draft.toDate });
      const record = {
        reference: nextBankReference(),
        transactionRef: transactionReference(sentAt),
        accountNumber,
        customerName: primary.name,
        fromDate: draft.fromDate,
        toDate: draft.toDate,
        totalBalance: money(primary.eoc, primary.currency),
        chargeAccount: `${charge.number} (${charge.currency})`,
        remark: draft.remark.trim(),
        channel: channel || state.otpChannel || "email",
        sentAt,
        status: state.bankHistory.some((item) => bankApplicationKey(item) === key) ? "resubmit" : "submit"
      };
      state.bankHistory.unshift(record);
      state.bankReceipt = record;
      state.bankDraft = emptyBankDraft();
      state.bankAlerts = [];
      state.bankFieldErrors = {};
      state.bankView = "receipt";
      saveBankHistory();
      render();
    }

    function bankReceiptRows(item) {
      const text = bankCopy();
      const channelName = item.channel === "sms" ? text.otpSms : text.otpEmail;
      const channelValue = item.channel === "sms" ? REGISTERED_PHONE_MASK : maskEmail(REGISTERED_EMAIL);
      return [
        [text.receiptTxnRef, item.transactionRef],
        [text.receiptSubmitted, formatSubmittedAt(item.sentAt)],
        [text.receiptRef, item.reference],
        [text.receiptStatus, item.status === "resubmit" ? text.statusResubmit : text.statusSubmit],
        [text.name, item.customerName],
        [text.account, item.accountNumber],
        [text.from, formatIso(item.fromDate)],
        [text.to, formatIso(item.toDate)],
        [text.balance, item.totalBalance],
        [text.charges, money(SERVICE_CHARGE, "MMK")],
        [text.feeAccount, item.chargeAccount],
        [text.receiptChannel, `${channelName} · ${channelValue}`],
        [text.remark, item.remark]
      ];
    }

    function bankReceiptPlain(item) {
      const text = bankCopy();
      const lines = bankReceiptRows(item).map(([label, value]) => `${label}: ${value || "—"}`);
      return ["KBZ BANK", text.receiptDocTitle, "", ...lines, "", text.receiptFoot].join("\n");
    }

    function downloadTextFile(filename, contents) {
      const blob = new Blob([contents], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function bankStatementPlain(item) {
      const text = bankCopy();
      const primary = accountByNumber(item.accountNumber);
      if (!primary) {
        return ["KBZ BANK", text.statementHeading, "", `${text.account}: ${item.accountNumber || "—"}`].join("\n");
      }
      const preview = previewTransactions(primary, item.fromDate, item.toDate, text.previewLines);
      const amount = (value) => value ? money(value, primary.currency) : "";
      const lines = [
        "KBZ BANK",
        text.statementHeading,
        "",
        `${text.name}: ${primary.name}`,
        `${text.account}: ${primary.number} (${primary.currency})`,
        `${text.from}: ${formatIso(item.fromDate)}`,
        `${text.to}: ${formatIso(item.toDate)}`,
        `${text.balance}: ${money(primary.eoc, primary.currency)}`,
        `${text.charges}: ${money(SERVICE_CHARGE, "MMK")}`,
        "",
        [text.colDate, text.colDescription, text.colDebit, text.colCredit, text.colBalance].join(" | "),
        [formatIso(item.fromDate), text.openingBalance, "", "", money(preview.opening, primary.currency)].join(" | "),
        ...preview.rows.map((row) => [
          formatIso(row.date),
          row.desc,
          amount(row.debit),
          amount(row.credit),
          money(row.balance, primary.currency)
        ].join(" | ")),
        [formatIso(item.toDate), text.closingBalance, "", "", money(preview.closing, primary.currency)].join(" | "),
        "",
        text.previewFoot
      ];
      if (item.remark) lines.push(`${text.remark}: ${item.remark}`);
      return lines.join("\n");
    }

    function bankReceiptFileName(item) {
      return `KBZ_Bank_Statement_${item.reference}.pdf`;

    function pdfSafe(value) {
      return String(value ?? "")
        .replaceAll("\\", "\\\\")
        .replaceAll("(", "\\(")
        .replaceAll(")", "\\)")
        .replace(/[^\x20-\x7E]/g, " ");
    }

    function buildSimplePdf(lines) {
      const commands = ["BT", "/F1 11 Tf", "48 790 Td", "16 TL"];
      lines.forEach((line, index) => {
        if (index) commands.push("T*");
        commands.push(`(${pdfSafe(line)}) Tj`);
      });
      commands.push("ET");
      const stream = commands.join("\n");
      const objects = [
        "1 0 obj << /Type /Catalog /Pages 2 0 R >> endobj",
        "2 0 obj << /Type /Pages /Kids [3 0 R] /Count 1 >> endobj",
        "3 0 obj << /Type /Page /Parent 2 0 R /MediaBox [0 0 595 842] /Contents 4 0 R /Resources << /Font << /F1 5 0 R >> >> >> endobj",
        `4 0 obj << /Length ${stream.length} >> stream\n${stream}\nendstream endobj`,
        "5 0 obj << /Type /Font /Subtype /Type1 /BaseFont /Helvetica >> endobj"
      ];
      let body = "%PDF-1.4\n";
      const offsets = [0];
      objects.forEach((object) => {
        offsets.push(body.length);
        body += `${object}\n`;
      });
      const xref = body.length;
      body += `xref\n0 ${objects.length + 1}\n`;
      body += "0000000000 65535 f \n";
      offsets.slice(1).forEach((offset) => {
        body += `${String(offset).padStart(10, "0")} 00000 n \n`;
      });
      body += `trailer << /Size ${objects.length + 1} /Root 1 0 R >>\nstartxref\n${xref}\n%%EOF`;
      return body;
    }

    function dateBetween(fromIso, toIso, ratio) {
      const from = new Date(`${fromIso}T00:00:00`);
      const to = new Date(`${toIso}T00:00:00`);
      const time = from.getTime() + (to.getTime() - from.getTime()) * ratio;
      return isoDate(new Date(time));
    }

    function previewTransactions(primary, fromDate, toDate, lines = requestText().previewLines) {
      const scale = Math.max(Number(primary.eoc) || 0, 1);
      const items = [
        { ratio: 0.2, desc: lines[0], credit: scale * 0.12 },
        { ratio: 0.42, desc: lines[1], debit: scale * 0.04 },
        { ratio: 0.63, desc: lines[2], credit: scale * 0.05 },
        { ratio: 0.84, desc: lines[3], debit: scale * 0.03 }
      ];
      const net = items.reduce((sum, item) => sum + (item.credit || 0) - (item.debit || 0), 0);
      let balance = primary.eoc - net;
      const opening = balance;
      const rows = items.map((item) => {
        balance += (item.credit || 0) - (item.debit || 0);
        return {
          date: dateBetween(fromDate, toDate, item.ratio),
          desc: item.desc,
          debit: item.debit || 0,
          credit: item.credit || 0,
          balance
        };
      });
      return { opening, rows, closing: primary.eoc };
    }

    function formatSentAt(iso) {
      const date = new Date(iso);
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");
      return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}, ${hours}:${minutes}`;
    }

    function formatSubmittedAt(iso) {
      const date = new Date(iso);
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      const hours = String(date.getHours()).padStart(2, "0");
      const minutes = String(date.getMinutes()).padStart(2, "0");
      const seconds = String(date.getSeconds()).padStart(2, "0");
      return `${date.getDate()} ${months[date.getMonth()]} ${date.getFullYear()}, ${hours}:${minutes}:${seconds}`;
    }

    function transactionReference(sentAt) {
      const date = new Date(sentAt);
      const pad = (value) => String(value).padStart(2, "0");
      const stamp = `${date.getFullYear()}${pad(date.getMonth() + 1)}${pad(date.getDate())}${pad(date.getHours())}${pad(date.getMinutes())}${pad(date.getSeconds())}`;
      const suffix = String(Math.floor(Math.random() * 9000) + 1000);
      return `TXN${stamp}${suffix}`;
    }

    function historyCountry(item, copyText) {
      if (item.countryId) return embassyLabel(requestText().countries, item.countryId);
      if (item.embassyId) return embassyLabel(copyText.embassies, item.embassyId);
      return "—";
    }

    function historyPeriod(item, copyText) {
      if (item.fromDate && item.toDate) return `${formatIso(item.fromDate)} – ${formatIso(item.toDate)}`;
      if (item.periodId) return embassyLabel(copyText.periods, item.periodId);
      return "—";
    }

    function historyPurpose(item, copyText) {
      const current = embassyLabel(requestText().purposes, item.purposeId);
      if (current && current !== item.purposeId) return current;
      const older = embassyLabel(copyText.purposes, item.purposeId);
      return older || "—";
    }

    function appliedDay(iso) {
      if (!iso) return "";
      const date = new Date(iso);
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${month}-${day}`;
    }

    function emptyEmbassyHistoryFilters() {
      return { appliedFrom: "", appliedTo: "", transactionRef: "", accountNumber: "" };
    }

    function filteredHistory() {
      const filters = state.historyFilters;
      const txn = filters.transactionRef.trim().toLowerCase();
      return state.embassyHistory.filter((item) => {
        const day = appliedDay(item.sentAt);
        if (filters.appliedFrom && day < filters.appliedFrom) return false;
        if (filters.appliedTo && day > filters.appliedTo) return false;
        const txnValue = `${item.transactionRef || ""} ${item.reference || ""}`.toLowerCase();
        if (txn && !txnValue.includes(txn)) return false;
        if (filters.accountNumber && item.accountNumber !== filters.accountNumber) return false;
        return true;
      });
    }

    function historyFiltersHtml(copyText) {
      const filters = state.historyFilters;
      const active = filters.appliedFrom || filters.appliedTo || filters.transactionRef || filters.accountNumber;
      return `
        <form class="history-filters" id="history-filters">
          <label>${escapeHtml(copyText.filterRange)}
            <span class="date-range">
              <input id="filter-from" name="appliedFrom" type="date" max="${escapeHtml(filters.appliedTo)}" value="${escapeHtml(filters.appliedFrom)}" />
              <input id="filter-to" name="appliedTo" type="date" min="${escapeHtml(filters.appliedFrom)}" value="${escapeHtml(filters.appliedTo)}" />
            </span>
          </label>
          <label>${escapeHtml(copyText.filterTxn)}
            <input id="filter-txn" name="transactionRef" type="search" placeholder="${escapeHtml(copyText.filterTxnPh)}" value="${escapeHtml(filters.transactionRef)}" />
          </label>
          <label>${escapeHtml(copyText.filterAccount)}
            <select id="filter-account" name="accountNumber">${accountFilterOptions(filters.accountNumber, state.embassyHistory, copyText.allAccounts)}</select>
          </label>
        </form>
        ${active ? `<div class="filter-clear"><button class="history-link" type="button" id="clear-filters">${escapeHtml(copyText.clearFilters)}</button></div>` : ""}`;
    }

    function applicationKey(item) {
      return [
        item.accountNumber || "",
        item.countryId || item.embassyId || "",
        item.fromDate || "",
        item.toDate || ""
      ].join("|");
    }

    function submissionStatus(item) {
      if (item.status === "submit" || item.status === "resubmit") return item.status;
      const key = applicationKey(item);
      const sentAt = new Date(item.sentAt).getTime();
      const earlier = state.embassyHistory.some((other) =>
        other.reference !== item.reference &&
        applicationKey(other) === key &&
        new Date(other.sentAt).getTime() < sentAt
      );
      return earlier ? "resubmit" : "submit";
    }

    function statusLabel(copyText, status) {
      return status === "resubmit" ? copyText.statusResubmit : copyText.statusSubmit;
    }

    function historyPager(copyText, total, page, pages) {
      const numbers = Array.from({ length: pages }, (_, index) => {
        const number = index + 1;
        return `<button class="page-btn${number === page ? " is-current" : ""}" type="button" data-page="${number}" ${number === page ? "aria-current=\"page\"" : ""}>${number}</button>`;
      }).join("");
      return `
        <div class="history-pager">
          <p class="history-total">${escapeHtml(copyText.totalLabel.replace("{count}", String(total)))}</p>
          <div class="history-pages">
            <button class="page-btn" type="button" data-page="${page - 1}" ${page <= 1 ? "disabled" : ""} aria-label="${escapeHtml(copyText.pagePrev)}">‹</button>
            ${numbers}
            <button class="page-btn" type="button" data-page="${page + 1}" ${page >= pages ? "disabled" : ""} aria-label="${escapeHtml(copyText.pageNext)}">›</button>
          </div>
        </div>`;
    }

    function embassyHistory(copyText) {
      const all = state.embassyHistory;
      const items = filteredHistory();
      const pages = Math.max(1, Math.ceil(items.length / HISTORY_PAGE_SIZE));
      if (state.historyPage > pages) state.historyPage = pages;
      if (state.historyPage < 1) state.historyPage = 1;
      const start = (state.historyPage - 1) * HISTORY_PAGE_SIZE;
      const pageItems = items.slice(start, start + HISTORY_PAGE_SIZE);
      const rows = pageItems.map((item) => {
        const txn = item.transactionRef || item.reference || "—";
        const status = submissionStatus(item);
        return `<tr>
          <td class="txn">${escapeHtml(txn)}</td>
          <td>${escapeHtml(item.accountNumber || "—")}</td>
          <td>${escapeHtml(historyCountry(item, copyText))}</td>
          <td class="nowrap">${escapeHtml(formatIso(item.fromDate) || "—")}</td>
          <td class="nowrap">${escapeHtml(formatIso(item.toDate) || "—")}</td>
          <td class="nowrap">${escapeHtml(item.totalBalance || "—")}</td>
          <td class="nowrap">${escapeHtml(item.sentAt ? formatSentAt(item.sentAt) : "—")}</td>
          <td><span class="status-pill status-${status}">${escapeHtml(statusLabel(copyText, status))}</span></td>
          <td class="nowrap"><button class="view-detail" type="button" data-detail="${escapeHtml(item.reference)}">${escapeHtml(copyText.viewDetails)}</button></td>
        </tr>`;
      }).join("");
      const banner = state.embassyNotice ? `<p class="banner">${escapeHtml(state.embassyNotice)}</p>` : "";
      const filters = all.length ? historyFiltersHtml(copyText) : "";
      const list = !all.length
        ? `<div class="empty-history"><p>${copyText.emptyHistory}</p><button class="get-start full-btn" type="button" id="history-start">${copyText.getStarted}</button></div>`
        : items.length
          ? `<div class="table-wrap"><table class="history-table"><colgroup><col style="width:16%"><col style="width:14%"><col style="width:12%"><col style="width:9%"><col style="width:9%"><col style="width:12%"><col style="width:12%"><col style="width:8%"><col style="width:8%"></colgroup><thead><tr>${copyText.columns.map((column) => `<th>${column}</th>`).join("")}</tr></thead><tbody>${rows}</tbody></table></div>${historyPager(copyText, items.length, state.historyPage, pages)}`
          : `<p class="history-empty-filter">${escapeHtml(copyText.noFilterMatch)}</p>`;
      return `
        ${all.length ? `<div class="page-top">${backButton("history-home")}</div>` : ""}
        <section class="embassy history-wide">
          <article class="history-card">
            ${banner}
            <h1>${copyText.historyTitle}</h1>
            <p class="lede">${copyText.historyBody}</p>
            ${filters}
            ${list}
          </article>
        </section>`;
    }

    function appliedDetailRows(item, copyText) {
      const text = requestText();
      const channelName = item.channel === "sms" ? text.otpSms : item.channel === "email" ? text.otpEmail : "";
      const channelValue = item.channel === "sms" ? REGISTERED_PHONE_MASK : item.channel === "email" ? maskEmail(item.email || REGISTERED_EMAIL) : "";
      const rows = [
        [text.receiptTxnRef, item.transactionRef || "—"],
        [copyText.appliedDate, item.sentAt ? formatSubmittedAt(item.sentAt) : "—"],
        [text.receiptRef, item.reference],
        [text.receiptStatus, statusLabel(copyText, submissionStatus(item))],
        [text.customer, item.customerName],
        [text.account, item.accountNumber],
        [text.from, formatIso(item.fromDate)],
        [text.to, formatIso(item.toDate)],
        [text.balance, item.totalBalance],
        [text.charges, item.fromDate || item.chargeAccount ? money(SERVICE_CHARGE, "MMK") : ""],
        [text.chargeAccount, item.chargeAccount],
        [text.country, historyCountry(item, copyText)],
        [text.purpose, historyPurpose(item, copyText)],
        [text.remark, item.remark]
      ];
      if (channelName) rows.push([text.receiptChannel, `${channelName} · ${channelValue}`]);
      return rows;
    }

    function embassyDetail(copyText) {
      const item = state.embassyHistory.find((entry) => entry.reference === state.historyDetail);
      if (!item) {
        state.embassyView = "history";
        return embassyHistory(copyText);
      }
      const list = appliedDetailRows(item, copyText).map(([label, value]) =>
        `<div class="confirm-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "—")}</strong></div>`
      ).join("");
      const primary = accountByNumber(item.accountNumber);
      const draft = draftFromHistory(item);
      const preview = primary && draft.fromDate && draft.toDate
        ? filePreviewHtml(primary, draft, historyCountry(item, copyText), historyPurpose(item, copyText), { notice: false, collapsed: false, download: true, fileName: `KBZ_Embassy_Statement_${item.reference}.pdf` })
        : "";
      const resubmit = isSubmitRecord(item)
        ? `<button class="send-btn" type="button" id="detail-resubmit">${escapeHtml(copyText.resubmitAction)}</button>`
        : "";
      return `
        <div class="page-top">${backButton("detail-back")}</div>
        <section class="embassy detail-wide">
          <article class="history-card">
            <div class="confirm-head">
              <h1>${escapeHtml(copyText.detailsTitle)}</h1>
              ${resubmit}
            </div>
            <p class="lede">${escapeHtml(copyText.detailsBody)}</p>
            <div class="confirm-list">${list}</div>
            ${preview}
          </article>
        </section>`;
    }

    function bindEmbassyDetail() {
      const back = document.getElementById("detail-back");
      if (!back) {
        bindEmbassyHistory();
        return;
      }
      bindFilePreview();
      const download = document.getElementById("embassy-detail-download");
      if (download) {
        download.addEventListener("click", () => {
          const item = state.embassyHistory.find((entry) => entry.reference === state.historyDetail);
          downloadEmbassyStatementFile(item);
        });
      }
      back.addEventListener("click", () => {
        state.embassyView = "history";
        render();
      });
      const resubmit = document.getElementById("detail-resubmit");
      if (resubmit) {
        resubmit.addEventListener("click", () => {
          const item = state.embassyHistory.find((entry) => entry.reference === state.historyDetail);
          if (!canResubmit(item)) return;
          const text = embassyCopy();
          const confirm = document.getElementById("resubmit-confirm");
          document.getElementById("resubmit-title").textContent = text.resubmitTitle;
          document.getElementById("resubmit-copy").textContent = text.resubmitBody;
          confirm.hidden = false;
          confirm.textContent = text.resubmitConfirm;
          document.getElementById("resubmit-cancel").textContent = requestText().cancel;
          document.getElementById("resubmit-dialog").showModal();
        });
      }
    }

    function ensureDemoSubmits() {
      let changed = false;
      state.embassyHistory.forEach((item) => {
        if (submissionStatus(item) === "submit" && item.resubmitUsed) {
          delete item.resubmitUsed;
          changed = true;
        }
      });
      const demos = [
        ["ES-101", "060**********1901 (MMK)", "060**********1901 (MMK)", "jp", "visa", "2026-01-15", "2026-10-20", "1,184,200.00 MMK", "Visa application for Japan.", 10],
        ["ES-102", "060**********7780 (USD)", "060**********1901 (MMK)", "sg", "education", "2026-03-01", "2026-10-20", "2,380.40 USD", "Education statement for Singapore.", 20],
        ["ES-103", "060**********1901 (MMK)", "060**********1901 (MMK)", "au", "official", "2026-04-10", "2026-10-20", "1,184,200.00 MMK", "Official request for Australia.", 30],
        ["ES-104", "060**********4412 (MMK)", "060**********4412 (MMK)", "kr", "employment", "2026-06-01", "2026-10-20", "84,200.00 MMK", "Employment statement for Korea.", 40]
      ];
      demos.forEach(([reference, accountNumber, chargeAccount, countryId, purposeId, fromDate, toDate, totalBalance, remark, minute], index) => {
        if (state.embassyHistory.some((item) => item.reference === reference)) return;
        const sentAt = new Date(2026, 9, 18, 9, minute, 0).toISOString();
        state.embassyHistory.unshift({
          reference,
          transactionRef: `TXN2026101809${String(minute).padStart(2, "0")}00${index + 1}001`,
          accountNumber,
          customerName: "NYEIN ZAY",
          fromDate,
          toDate,
          totalBalance,
          chargeAccount,
          countryId,
          purposeId,
          email: REGISTERED_EMAIL,
          remark,
          channel: "email",
          sentAt,
          status: "submit"
        });
        changed = true;
      });
      if (changed) saveEmbassyHistory();
    }

    function isSubmitRecord(item) {
      return Boolean(item) && submissionStatus(item) === "submit";
    }

    function canResubmit(item) {
      return isSubmitRecord(item) && !item.resubmitUsed;
    }

    function nextEmbassyReference() {
      const max = state.embassyHistory.reduce((highest, item) => {
        const number = Number(String(item.reference || "").replace(/\D/g, ""));
        return Number.isFinite(number) ? Math.max(highest, number) : highest;
      }, 0);
      return `ES-${String(max + 1).padStart(3, "0")}`;
    }

    function confirmResubmit(item) {
      const sentAt = new Date().toISOString();
      const record = {
        reference: nextEmbassyReference(),
        transactionRef: transactionReference(sentAt),
        accountNumber: item.accountNumber,
        customerName: item.customerName,
        fromDate: item.fromDate,
        toDate: item.toDate,
        totalBalance: item.totalBalance,
        chargeAccount: item.chargeAccount,
        countryId: item.countryId || item.embassyId || "",
        purposeId: item.purposeId,
        email: item.email || REGISTERED_EMAIL,
        remark: item.remark || "",
        channel: item.channel || "",
        sentAt,
        status: "resubmit",
        resubmitOf: item.reference,
        resubmitUsed: true
      };
      item.resubmitUsed = true;
      state.embassyHistory.unshift(record);
      saveEmbassyHistory();
      state.historyFilters = emptyEmbassyHistoryFilters();
      state.historyPage = 1;
      state.historyDetail = "";
      state.embassyNotice = "";
      state.embassyView = "history";
      render();
      toast(embassyCopy().resubmitToast, 4000, "success");
    }

    function openEmbassyHistory() {
      state.embassyHistoryAlert = false;
      state.embassyView = "history";
      render();
    }

    function bindEmbassyWelcome() {
      document.getElementById("get-started").addEventListener("click", () => {
        state.embassyView = "form";
        state.embassyError = "";
        render();
      });
      document.getElementById("open-history").addEventListener("click", openEmbassyHistory);
    }

    function syncDraftFromForm(form) {
      const data = new FormData(form);
      const draft = state.embassyDraft;
      draft.account = data.get("account") || "";
      draft.fromDate = data.get("fromDate") || "";
      draft.toDate = data.get("toDate") || "";
      draft.country = data.get("country") || "";
      draft.purpose = data.get("purpose") || "";
      draft.remark = String(data.get("remark") || "").slice(0, 200);
      const primary = accountById(draft.account);
      if (primary && primary.type === "LCY") draft.chargeAccount = primary.id;
      else draft.chargeAccount = data.get("chargeAccount") || "";
    }

    function validateInquiry() {
      const draft = state.embassyDraft;
      const errors = {};
      const alerts = [];
      const yesterday = yesterdayIso();
      const primary = accountById(draft.account);
      if (!draft.account) errors.account = true;
      if (!draft.fromDate) errors.fromDate = true;
      if (!draft.toDate) errors.toDate = true;
      if (!draft.country) errors.country = true;
      if (!draft.purpose) errors.purpose = true;
      if (!draft.remark.trim()) errors.remark = true;
      const charge = resolvedCharge(draft);
      if (!charge) errors.chargeAccount = true;
      if (Object.keys(errors).length) alerts.push("msg007");
      if (draft.toDate && draft.toDate > yesterday) {
        errors.toDate = true;
        alerts.push("toRule");
      }
      if (draft.fromDate && (draft.fromDate > yesterday || (draft.toDate && draft.fromDate > draft.toDate))) {
        errors.fromDate = true;
        if (draft.toDate && draft.fromDate > draft.toDate) errors.toDate = true;
        alerts.push("dateOrder");
      }
      if (primary && draft.fromDate && draft.fromDate < primary.opened) {
        errors.fromDate = true;
        alerts.push("msg025");
      }
      if (charge) {
        chargeIssues(charge).forEach((key) => {
          errors.chargeAccount = true;
          alerts.push(key);
        });
      }
      state.embassyFieldErrors = errors;
      state.embassyAlerts = alerts;
      return alerts.length === 0;
    }

    function bindEmbassyForm() {
      const form = document.getElementById("embassy-form");
      form.addEventListener("change", () => {
        syncDraftFromForm(form);
        state.embassyAlerts = [];
        state.embassyFieldErrors = {};
        render();
      });
      const remark = form.querySelector("[name=remark]");
      remark.addEventListener("input", () => {
        state.embassyDraft.remark = remark.value.slice(0, 200);
        const count = document.getElementById("remark-count");
        if (count) count.textContent = `${state.embassyDraft.remark.length}/200`;
      });
      document.getElementById("embassy-cancel").addEventListener("click", () => {
        state.embassyDraft = emptyEmbassyDraft();
        state.embassyAlerts = [];
        state.embassyFieldErrors = {};
        render();
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        syncDraftFromForm(form);
        if (inquiryBlocked() || !validateInquiry()) {
          render();
          return;
        }
        state.embassyAlerts = [];
        state.embassyFieldErrors = {};
        state.embassyAgreed = false;
        state.embassyView = "confirm";
        render();
      });
    }

    function statementPreviewSource() {
      const text = requestText();
      if (state.embassyView === "detail") {
        const item = state.embassyHistory.find((entry) => entry.reference === state.historyDetail);
        if (!item) return null;
        const primary = accountByNumber(item.accountNumber);
        if (!primary || !item.fromDate || !item.toDate) return null;
        return {
          primary,
          draft: draftFromHistory(item),
          country: historyCountry(item, embassyCopy()),
          purpose: historyPurpose(item, embassyCopy())
        };
      }
      const draft = state.embassyDraft;
      const primary = accountById(draft.account);
      if (!primary) return null;
      return {
        primary,
        draft,
        country: embassyLabel(text.countries, draft.country),
        purpose: embassyLabel(text.purposes, draft.purpose)
      };
    }

    function openStatementPreview() {
      const source = statementPreviewSource();
      if (!source) return;
      const text = requestText();
      document.getElementById("preview-filename").textContent = statementFileName(source.primary);
      document.getElementById("preview-close").textContent = text.closePreview;
      document.getElementById("preview-body").innerHTML = statementPaperHtml(source.primary, source.draft, source.country, source.purpose);
      document.getElementById("file-preview").showModal();
    }

    function bindFilePreview() {
      const previewBtn = document.getElementById("open-preview");
      if (previewBtn) previewBtn.addEventListener("click", openStatementPreview);
      const toggle = document.getElementById("toggle-preview");
      const section = document.querySelector(".file-preview");
      if (toggle && section) {
        toggle.addEventListener("click", () => {
          const collapsed = section.classList.toggle("is-collapsed");
          const label = toggle.querySelector(".toggle-label");
          toggle.setAttribute("aria-expanded", String(!collapsed));
          if (label) label.textContent = collapsed ? requestText().showStatement : requestText().hideStatement;
        });
      }
    }

    function bindEmbassyConfirm() {
      bindFilePreview();
      document.getElementById("confirm-edit").addEventListener("click", () => {
        state.embassyView = "form";
        render();
      });
      document.getElementById("confirm-back").addEventListener("click", () => {
        state.embassyView = "form";
        render();
      });
      bindAgreement("embassy-agree", "confirm-send", "embassy-terms", "embassyAgreed", requestText());
      document.getElementById("confirm-send").addEventListener("click", () => {
        if (!state.embassyAgreed) return;
        openAuthScreen();
      });
    }

                  <svg class="eye-open" viewBox="0 0 24 24" aria-hidden="true"><path d="M2 12s3.5-6 10-6 10 6 10 6-3.5 6-10 6-10-6-10-6z"/><circle cx="12" cy="12" r="3"/></svg>
                  <svg class="eye-off" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3l18 18"/><path d="M10.6 10.6a3 3 0 0 0 4.2 4.2"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.5 0 10 7 10 7a18 18 0 0 1-3.2 4.2"/><path d="M6.1 6.1C3.8 7.8 2 12 2 12a18.4 18.4 0 0 0 6.2 5.4"/></svg>

    function clearAuth() {
      state.authPassword = "";
      state.authShow = false;
      state.authError = false;
      state.authForget = false;
    }

    function clearOtp() {
      state.otpChannel = "";
      state.otpCode = "";
      state.otpError = "";
      state.otpDeadline = 0;
      state.otpResent = false;
      stopOtpTimer();
    }

    let otpTimer = null;

    function stopOtpTimer() {
      if (otpTimer) {
        clearInterval(otpTimer);
        otpTimer = null;
      }
    }

    function otpSecondsLeft() {
      if (!state.otpDeadline) return OTP_TIMEOUT;
      return Math.max(0, Math.ceil((state.otpDeadline - Date.now()) / 1000));
    }

    function flowCopy() {
      if (state.page === "bank-statement") return bankCopy();
      if (state.page === "e-statement") return eCopy();
      return requestText();
    }

    function paintOtpTimer() {
      const text = flowCopy();
      const left = otpSecondsLeft();
      const count = document.getElementById("otp-count");
      const resend = document.getElementById("otp-resend");
      if (count) count.textContent = text.otpTimeout.replace("{seconds}", String(left));
      if (resend) {
        resend.disabled = left > 0;
        resend.textContent = text.otpResend;
      }
    }

    function startOtpTimer() {
      stopOtpTimer();
      paintOtpTimer();
      if (otpSecondsLeft() <= 0) return;
      otpTimer = setInterval(() => {
        const onBankOtp = state.page === "bank-statement" && state.bankView === "otp";
        const onEmbassyOtp = state.page === "embassy" && state.embassyView === "otp";
        const onEOtp = state.page === "e-statement" && state.eView === "otp";
        if (!onBankOtp && !onEmbassyOtp && !onEOtp) {
          stopOtpTimer();
          return;
        }
        paintOtpTimer();
        if (otpSecondsLeft() <= 0) stopOtpTimer();
      }, 250);
    }

    function openAuthScreen() {
      clearAuth();
      state.embassyView = "auth";
      render();
      const input = document.getElementById("auth-password");
      if (input) input.focus();
    }

    function bindEmbassyAuth() {

        input.type = state.authShow ? "text" : "password";

      });

        state.authError = false;
        input.closest(".auth-field").classList.remove("invalid");
        document.getElementById("auth-error").hidden = true;
      });
      document.getElementById("auth-form").addEventListener("submit", (event) => {
        event.preventDefault();
        state.authPassword = input.value;
        const password = input.value.trim();
        const error = document.getElementById("auth-error");
        const showError = (key) => {
          state.authError = key;
          input.closest(".auth-field").classList.add("invalid");
          error.hidden = false;
          const message = key === "wrong" ? requestText().authWrong : requestText().authRequired;
          error.textContent = message.replace("{password}", DEMO_PASSWORD);
          input.focus();
        };

          showError("required");
          return;
        }
        if (password !== DEMO_PASSWORD) {
          showError("wrong");
          return;
        }

    function maskEmail(email) {
      const [local, domain] = String(email).split("@");
      if (!local || !domain) return email;
      if (local.length < 2) return `***@${domain}`;
      return `${local[0]}***${local.slice(-1)}@${domain}`;
    }

    function sendEmbassyStatement(channel) {
      const draft = state.embassyDraft;
      const primary = accountById(draft.account);
      const charge = resolvedCharge(draft);
      if (!primary || !charge) return;
      const count = String(state.embassyHistory.length + 1).padStart(3, "0");
      const sentAt = new Date().toISOString();
      const record = {
        reference: `ES-${count}`,
        transactionRef: transactionReference(sentAt),
        accountNumber: `${primary.number} (${primary.currency})`,
        customerName: primary.name,
        fromDate: draft.fromDate,
        toDate: draft.toDate,
        totalBalance: money(primary.eoc, primary.currency),
        chargeAccount: `${charge.number} (${charge.currency})`,
        countryId: draft.country,
        purposeId: draft.purpose,
        email: REGISTERED_EMAIL,
        remark: draft.remark.trim(),
        channel: channel || state.otpChannel || "email",
        sentAt,
        status: state.embassyHistory.some((item) => applicationKey(item) === applicationKey({
          accountNumber: `${primary.number} (${primary.currency})`,
          countryId: draft.country,
          fromDate: draft.fromDate,
          toDate: draft.toDate
        })) ? "resubmit" : "submit"
      };
      state.embassyHistory.unshift(record);
      state.embassyReceipt = record;
      state.embassyDraft = emptyEmbassyDraft();
      state.embassyAlerts = [];
      state.embassyFieldErrors = {};
      state.embassyNotice = embassyCopy().sentNotice;
      state.embassyView = "receipt";
      saveEmbassyHistory();
      render();
    }

    function otpDestination() {
      return state.otpChannel === "sms" ? REGISTERED_PHONE_MASK : maskEmail(REGISTERED_EMAIL);
    }

    function embassyOtp() {
      const text = requestText();
      const digits = String(state.otpCode || "").replace(/\D/g, "").slice(0, 6).split("");
      const boxes = Array.from({ length: 6 }, (_, index) => {
        const value = digits[index] || "";
        return `<input class="otp-digit" inputmode="numeric" maxlength="1" autocomplete="${index === 0 ? "one-time-code" : "off"}" aria-label="${escapeHtml(text.otpDigit)} ${index + 1}" value="${escapeHtml(value)}" />`;
      }).join("");
      const errorText = state.otpError === "wrong" ? text.otpWrong : text.otpCodeRequired;
      const error = state.otpError
        ? `<p class="auth-error" id="otp-code-error">${escapeHtml(errorText.replace("{otp}", DEMO_OTP))}</p>`
        : `<p class="auth-error" id="otp-code-error" hidden></p>`;
      const left = otpSecondsLeft();
      const resent = state.otpResent
        ? `<p class="otp-resent" id="otp-resent">${escapeHtml(text.otpResent)}</p>`
        : `<p class="otp-resent" id="otp-resent" hidden></p>`;
      return `
        <section class="embassy embassy-center auth-screen">
          <div class="page-top">${backButton("otp-back")}</div>
          <article class="send-card auth-card">
            <form class="auth-body" id="otp-code-form" novalidate>
              <div class="auth-mark" aria-hidden="true">
                <svg viewBox="0 0 24 24"><path d="M12 3.5 19 6.5v5.2c0 4.2-2.8 7.2-7 8.8-4.2-1.6-7-4.6-7-8.8V6.5L12 3.5z"/><path d="M12 11v4"/><path d="M12 8.5h.01"/></svg>
              </div>
              <h1>${escapeHtml(text.otpFillTitle)}</h1>
              <p class="auth-copy">${escapeHtml(text.otpFillBody.replace("{destination}", otpDestination()))}</p>
              <div class="otp-digits ${state.otpError ? "invalid" : ""}" id="otp-digits">${boxes}</div>
              <div class="otp-timeout">
                <p class="otp-count" id="otp-count">${escapeHtml(text.otpTimeout.replace("{seconds}", String(left)))}</p>
                <button class="otp-resend" id="otp-resend" type="button" ${left > 0 ? "disabled" : ""}>${escapeHtml(text.otpResend)}</button>
              </div>
              ${resent}
              ${error}
              <div class="auth-actions">
                <p class="auth-demo">${escapeHtml(text.otpDemo).replace("{otp}", `<strong>${DEMO_OTP}</strong>`)}</p>
                <button class="send-btn full-btn" type="submit">${escapeHtml(text.otpVerify)}</button>
              </div>
            </form>
          </article>
        </section>`;
    }

    function readOtpDigits(boxes) {
      return boxes.map((box) => box.value.replace(/\D/g, "").slice(-1)).join("");
    }

    function bindEmbassyOtp() {
      const boxes = [...document.querySelectorAll(".otp-digit")];
      const error = document.getElementById("otp-code-error");
      const hideError = () => {
        state.otpError = "";
        state.otpResent = false;
        document.getElementById("otp-digits").classList.remove("invalid");
        error.hidden = true;
        const note = document.getElementById("otp-resent");
        if (note) note.hidden = true;
      };
      document.getElementById("otp-back").addEventListener("click", () => {
        clearOtp();
        state.embassyView = "auth";
        render();
      });
      boxes.forEach((box, index) => {
        box.addEventListener("input", () => {
          const digit = box.value.replace(/\D/g, "").slice(-1);
          box.value = digit;
          state.otpCode = readOtpDigits(boxes);
          hideError();
          if (digit && boxes[index + 1]) boxes[index + 1].focus();
        });
        box.addEventListener("keydown", (event) => {
          if (event.key === "Backspace" && !box.value && boxes[index - 1]) {
            boxes[index - 1].value = "";
            boxes[index - 1].focus();
            state.otpCode = readOtpDigits(boxes);
            hideError();
          }
          if (event.key === "ArrowLeft" && boxes[index - 1]) boxes[index - 1].focus();
          if (event.key === "ArrowRight" && boxes[index + 1]) boxes[index + 1].focus();
        });
        box.addEventListener("paste", (event) => {
          event.preventDefault();
          const pasted = (event.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
          pasted.split("").forEach((digit, digitIndex) => {
            if (boxes[digitIndex]) boxes[digitIndex].value = digit;
          });
          state.otpCode = readOtpDigits(boxes);
          hideError();
          const next = boxes[Math.min(pasted.length, boxes.length - 1)];
          if (next) next.focus();
        });
      });
      document.getElementById("otp-resend").addEventListener("click", () => {
        if (otpSecondsLeft() > 0) return;
        state.otpDeadline = Date.now() + OTP_TIMEOUT * 1000;
        state.otpCode = "";
        state.otpError = "";
        state.otpResent = true;
        boxes.forEach((box) => { box.value = ""; });
        document.getElementById("otp-digits").classList.remove("invalid");
        error.hidden = true;
        const note = document.getElementById("otp-resent");
        note.hidden = false;
        note.textContent = requestText().otpResent;
        startOtpTimer();
        boxes[0].focus();
      });
      document.getElementById("otp-code-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const code = readOtpDigits(boxes);
        state.otpCode = code;
        const showError = (key) => {
          state.otpError = key;
          render();
        };
        if (code.length < 6) {
          showError("required");
          return;
        }
        if (code !== DEMO_OTP) {
          showError("wrong");
          return;
        }
        const channel = state.otpChannel;
        clearOtp();
        sendEmbassyStatement(channel);
      });
      if (!state.otpDeadline) state.otpDeadline = Date.now() + OTP_TIMEOUT * 1000;
      startOtpTimer();
      const firstEmpty = boxes.find((box) => !box.value) || boxes[0];
      if (firstEmpty) firstEmpty.focus();
    }

    function receiptRows(item) {
      const text = requestText();
      const channelName = item.channel === "sms" ? text.otpSms : text.otpEmail;
      const channelValue = item.channel === "sms" ? REGISTERED_PHONE_MASK : maskEmail(REGISTERED_EMAIL);
      return [
        [text.receiptTxnRef, item.transactionRef],
        [text.receiptSubmitted, formatSubmittedAt(item.sentAt)],
        [text.receiptRef, item.reference],
        [text.receiptStatus, statusLabel(embassyCopy(), submissionStatus(item))],
        [text.customer, item.customerName],
        [text.account, item.accountNumber],
        [text.country, embassyLabel(text.countries, item.countryId)],
        [text.purpose, embassyLabel(text.purposes, item.purposeId)],
        [text.from, formatIso(item.fromDate)],
        [text.to, formatIso(item.toDate)],
        [text.charges, money(SERVICE_CHARGE, "MMK")],
        [text.chargeAccount, item.chargeAccount],
        [text.receiptChannel, `${channelName} · ${channelValue}`],
        [text.remark, item.remark]
      ];
    }

    function receiptPlain(item) {
      const lines = receiptRows(item).map(([label, value]) => `${label}: ${value || "—"}`);
      return ["KBZ BANK", "Embassy Statement Receipt", "", ...lines, "", "This receipt confirms the statement was submitted to the embassy."].join("\n");
    }

    function downloadReceipt() {
      const item = state.embassyReceipt;
      if (!item) return;
      const blob = new Blob([receiptPlain(item)], { type: "text/plain;charset=utf-8" });
      const link = document.createElement("a");
      const url = URL.createObjectURL(blob);
      link.href = url;
      link.download = `KBZ_Embassy_Receipt_${item.reference}.txt`;
      document.body.appendChild(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }

    function toast(message, duration = 2400, variant = "") {
      const el = document.getElementById("toast");
      clearTimeout(toast._t);
      el.classList.remove("show", "toast-success");
      if (variant === "success") {
        el.classList.add("toast-success");
        el.innerHTML = `<span class="toast-check" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12.5 4.2 4.2L19 7.5"/></svg></span><span class="toast-text"></span><button class="toast-close" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg></button>`;
        el.querySelector(".toast-text").textContent = message;
        el.querySelector(".toast-close").setAttribute("aria-label", t().close);
      } else {
        el.textContent = message;
      }
      requestAnimationFrame(() => el.classList.add("show"));
      toast._t = setTimeout(() => el.classList.remove("show"), duration);
    }

    document.getElementById("dlg-start").addEventListener("click", () => {
      dialog.close();
      toast(t().toastStart);
    });
    dialog.addEventListener("click", (event) => {
      if (event.target === dialog) dialog.close();
    });
    const termsDialog = document.getElementById("terms-dialog");
    termsDialog.addEventListener("click", (event) => {
      if (event.target === termsDialog) termsDialog.close();
    });

    const eModifyDialog = document.getElementById("e-modify-dialog");
    const eModifyFields = document.getElementById("e-modify-fields");
    document.getElementById("e-modify-cancel").addEventListener("click", () => eModifyDialog.close());
    eModifyDialog.addEventListener("click", (event) => {
      if (event.target === eModifyDialog) eModifyDialog.close();
    });
    eModifyDialog.addEventListener("close", () => {
      state.eModifyError = "";
    });
    eModifyFields.addEventListener("click", (event) => {
      const draft = state.eModifyDraft;
      if (!draft) return;
      const step = event.target.closest("[data-step]");
      const day = event.target.closest("[data-weekday]");
      if (step && !step.disabled) {
        const bounds = periodBounds(draft.periodType);
        const current = Number(draft.period) || bounds[0];
        draft.period = String(Math.min(bounds[1], Math.max(bounds[0], current + Number(step.dataset.step))));
        state.eModifyError = "";
        fillEModifyDialog();
      }
      if (day) {
        draft.frequency = "weekly";
        draft.weekday = day.dataset.weekday;
        state.eModifyError = "";
        fillEModifyDialog();
      }
    });
    eModifyFields.addEventListener("change", (event) => {
      const draft = state.eModifyDraft;
      if (!draft) return;
      const target = event.target;
      if (target.name === "frequency") {
        draft.frequency = target.value;
        if (draft.frequency !== "weekly") draft.weekday = "";
      }
      if (target.name === "periodType") {
        draft.periodType = target.value;
        const bounds = periodBounds(draft.periodType);
        let value = Number(draft.period);
        if (!draft.period || Number.isNaN(value)) value = 1;
        draft.period = String(Math.min(bounds[1], Math.max(bounds[0], value)));
      }
      if (target.name === "period") {
        const bounds = periodBounds(draft.periodType);
        let value = Number(target.value);
        if (!target.value || Number.isNaN(value)) value = bounds[0];
        draft.period = String(Math.min(bounds[1], Math.max(bounds[0], value)));
      }
      state.eModifyError = "";
      fillEModifyDialog();
    });
    document.getElementById("e-modify-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const item = eModifyItem();
      const draft = state.eModifyDraft;
      if (!item || !draft || item.status === "inactive") return;
      const bounds = periodBounds(draft.periodType);
      const period = Number(draft.period);
      if (!draft.frequency || (draft.frequency === "weekly" && !draft.weekday) || !draft.periodType || !period || period < bounds[0] || period > bounds[1]) {
        state.eModifyError = "msg007";
        fillEModifyDialog();
        return;
      }
      if (item.modified) return;
      if (activeEFrequency(draft.frequency, item.reference)) {
        state.eModifyError = "freqLimit";
        fillEModifyDialog();
        return;
      }
      openEConfirm("modify", item.reference);
    });

    const eConfirmDialog = document.getElementById("e-confirm-dialog");
    document.getElementById("e-confirm-cancel").addEventListener("click", () => eConfirmDialog.close());
    eConfirmDialog.addEventListener("click", (event) => {
      if (event.target === eConfirmDialog) eConfirmDialog.close();
    });
    eConfirmDialog.addEventListener("close", () => {
      state.eConfirmKind = "";
    });
    document.getElementById("e-confirm-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const kind = state.eConfirmKind;
      const reference = state.eConfirmRef;
      eConfirmDialog.close();
      if (kind === "modify") applyEModify();
      if (kind === "deactivate") deactivateESchedule(reference);
    });

    const resubmitDialog = document.getElementById("resubmit-dialog");
    document.getElementById("resubmit-cancel").addEventListener("click", () => resubmitDialog.close());
    resubmitDialog.addEventListener("click", (event) => {
      if (event.target === resubmitDialog) resubmitDialog.close();
    });
    document.getElementById("resubmit-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const item = state.embassyHistory.find((entry) => entry.reference === state.historyDetail);
      resubmitDialog.close();
      if (!item || !canResubmit(item)) return;
      confirmResubmit(item);
    });

    const otpDialog = document.getElementById("otp-dialog");
    document.getElementById("otp-cancel").addEventListener("click", () => otpDialog.close());
    otpDialog.addEventListener("click", (event) => {
      if (event.target === otpDialog) otpDialog.close();
    });
    document.getElementById("otp-form").addEventListener("change", () => {
      document.getElementById("otp-error").hidden = true;
    });
    document.getElementById("otp-form").addEventListener("submit", (event) => {
      event.preventDefault();
      const selected = document.querySelector("#otp-form input[name=otpChannel]:checked");
      const error = document.getElementById("otp-error");
      if (!selected) {
        error.hidden = false;
        error.textContent = flowCopy().otpRequired;
        return;
      }
      otpDialog.close();
      clearAuth();
      state.otpChannel = selected.value;
      state.otpCode = "";
      state.otpError = "";
      state.otpResent = false;
      state.otpDeadline = Date.now() + OTP_TIMEOUT * 1000;
      if (state.page === "bank-statement") state.bankView = "otp";
      else if (state.page === "e-statement") state.eView = "otp";
      else state.embassyView = "otp";
      render();
    });

    ensureDemoSubmits();
    render();
  </script>
</body>
</html>
