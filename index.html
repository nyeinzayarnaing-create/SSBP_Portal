<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>KBZ Bank — My Account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Myanmar:wght@400;600;700&family=Noto+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --sidebar: #ffffff;
      --sidebar-ink: #1c2430;
      --sidebar-muted: #8a93a0;
      --active: #e8f3fc;
      --page: #f5f6f8;
      --card: #ffffff;
      --ink: #1a1a1a;
      --muted: #8a8a8a;
      --body: #5e5e5e;
      --line: #e6e8ec;
      --blue: #0e8eda;
      --blue-deep: #0b7ec4;
      --btn: #d2e6fe;
      --btn-ink: #3d74c4;
      --avatar: #f0686a;
      --navy: #0b3b8c;
      --shadow: 0 1px 2px rgba(16, 24, 40, 0.04), 0 8px 24px rgba(16, 24, 40, 0.05);
      --sidebar-w: 232px;
    }

    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; }
    body {
      font-family: "Noto Sans", "Noto Sans Myanmar", "Myanmar Text", sans-serif;
      color: var(--ink);
      background: var(--page);
      -webkit-font-smoothing: antialiased;
    }
    button, input { font-family: inherit; }
    button { cursor: pointer; }

    .app {
      display: flex;
      min-height: 100vh;
    }

    .sidebar {
      width: var(--sidebar-w);
      flex: none;
      background: var(--sidebar);
      color: var(--sidebar-ink);
      border-right: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      position: sticky;
      top: 0;
      height: 100vh;
    }

    .brand {
      display: flex;
      align-items: center;
      padding: 22px 18px 16px;
    }
    .brand img {
      display: block;
      width: 100%;
      height: auto;
    }

    .nav-label {
      margin: 8px 0 6px;
      padding: 0 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.08em;
      color: var(--sidebar-muted);
    }
    .nav {
      display: flex;
      flex-direction: column;
      padding: 0 10px;
      gap: 2px;
    }
    .nav-item {
      display: flex;
      align-items: flex-start;
      gap: 12px;
      width: 100%;
      text-align: left;
      background: transparent;
      border: 0;
      color: var(--sidebar-ink);
      border-radius: 8px;
      padding: 10px 10px;
      font-size: 13.5px;
      line-height: 1.35;
      font-weight: 500;
    }
    .nav-item svg {
      width: 18px;
      height: 18px;
      flex: none;
      margin-top: 1px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .nav-item:hover { background: #f3f5f8; }
    .nav-item.active {
      background: var(--active);
      color: #0b63a8;
      font-weight: 650;
    }
    .nav-item span { min-width: 0; }
    .sidebar-foot { margin-top: auto; padding-bottom: 18px; }

    .main {
      flex: 1;
      min-width: 0;
      display: flex;
      flex-direction: column;
      background: var(--page);
    }

    .topbar {
      height: 64px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      padding: 0 28px;
      gap: 16px;
      border-bottom: 1px solid rgba(16, 24, 40, 0.04);
      position: sticky;
      top: 0;
      z-index: 5;
    }
    .langs {
      display: flex;
      align-items: center;
      gap: 10px;
      color: #8d8d8d;
      font-size: 14px;
    }
    .langs button {
      background: none;
      border: 0;
      padding: 0;
      color: #9a9a9a;
      font-size: 14px;
      font-weight: 500;
    }
    .langs button[aria-pressed="true"] {
      color: #3a3a3a;
      font-weight: 650;
    }
    .langs .sep { color: #c8c8c8; }

    .user {
      position: relative;
    }
    .user-btn {
      display: flex;
      align-items: center;
      gap: 10px;
      background: none;
      border: 0;
      padding: 4px 2px;
      color: #3a3a3a;
      font-size: 14px;
      font-weight: 650;
      letter-spacing: 0.01em;
    }
    .avatar {
      width: 34px;
      height: 34px;
      border-radius: 50%;
      background: var(--avatar);
      color: white;
      display: grid;
      place-items: center;
      font-weight: 700;
      font-size: 15px;
    }
    .caret {
      width: 16px;
      height: 16px;
      color: #8a8a8a;
    }
    .menu {
      position: absolute;
      right: 0;
      top: calc(100% + 8px);
      background: white;
      border-radius: 10px;
      box-shadow: 0 12px 32px rgba(16, 24, 40, 0.14);
      min-width: 180px;
      padding: 6px;
      display: none;
      z-index: 8;
    }
    .menu.open { display: block; }
    .menu button {
      width: 100%;
      text-align: left;
      background: none;
      border: 0;
      padding: 10px 12px;
      border-radius: 8px;
      font-size: 14px;
      color: #243044;
    }
    .menu button:hover { background: #f4f7fb; }

    .content {
      padding: 22px 32px 48px;
    }
    .crumb {
      margin: 0 0 16px;
      color: var(--muted);
      font-size: 14px;
      font-weight: 500;
    }

    .account-chip {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: linear-gradient(180deg, #1a96e2 0%, #0d8cda 55%, #0c86d4 100%);
      color: white;
      border-radius: 8px;
      padding: 12px 16px 12px 12px;
      min-width: 320px;
      box-shadow: 0 1px 0 rgba(255, 255, 255, 0.25) inset, 0 6px 16px rgba(12, 110, 180, 0.18);
    }
    .bank-badge {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.18);
      display: grid;
      place-items: center;
      flex: none;
    }
    .bank-badge svg { width: 20px; height: 20px; stroke: white; fill: none; stroke-width: 1.7; }
    .chip-copy { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .chip-title { font-size: 13.5px; font-weight: 600; letter-spacing: 0.01em; }
    .chip-balance {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      letter-spacing: 0.08em;
      font-weight: 600;
    }
    .langs button[data-lang="my"] {
      font-family: "Noto Sans Myanmar", "Myanmar Text", sans-serif;
    }
    .eye {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 0;
      background: transparent;
      color: white;
      display: grid;
      place-items: center;
      padding: 0;
    }
    .eye:hover { background: rgba(255, 255, 255, 0.16); }
    .eye svg { width: 16px; height: 16px; stroke: white; fill: none; stroke-width: 1.7; }
    .chip-balance.revealed { letter-spacing: 0.01em; font-weight: 650; }

    .greeting {
      margin: 26px 0 18px;
      font-size: 26px;
      line-height: 1.3;
      font-weight: 750;
      letter-spacing: -0.02em;
      color: #1b1b1b;
    }

    .products {
      display: grid;
      grid-template-columns: 380px 380px;
      gap: 28px;
      align-items: stretch;
    }
    .product {
      background: var(--card);
      border-radius: 6px;
      box-shadow: var(--shadow);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      border: 1px solid rgba(16, 24, 40, 0.04);
    }
    .media {
      height: 196px;
      background: #e9eef3;
      overflow: hidden;
    }
    .media img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center 40%;
      display: block;
    }
    .cash-art {
      height: 100%;
      background: var(--navy);
      display: grid;
      place-items: center;
      position: relative;
    }
    .bubble {
      width: 230px;
      height: 150px;
      background: white;
      border-radius: 50%;
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      color: #161616;
      padding: 22px 28px 8px;
    }
    .bubble::after {
      content: "";
      position: absolute;
      width: 28px;
      height: 28px;
      background: white;
      left: 42px;
      bottom: -8px;
      clip-path: polygon(0 0, 100% 0, 18% 100%);
    }
    .bubble .q {
      font-family: Georgia, "Times New Roman", serif;
      font-weight: 700;
      font-size: 28px;
      line-height: 1;
      position: absolute;
    }
    .bubble .q-open { top: 16px; left: 22px; }
    .bubble .q-close { right: 18px; bottom: 14px; }
    .bubble .b1, .bubble .b2 {
      margin: 0;
      font-family: "Noto Sans Myanmar", "Myanmar Text", sans-serif;
      font-weight: 700;
      font-size: 20px;
      line-height: 1.35;
    }
    .bubble .b3 {
      margin: 4px 0 0;
      font-family: "Noto Sans Myanmar", "Myanmar Text", sans-serif;
      font-size: 9px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .product-body {
      padding: 18px 18px 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      flex: 1;
    }
    .product h2 {
      margin: 0;
      font-size: 15px;
      line-height: 1.4;
      font-weight: 700;
      color: #1c1c1c;
    }
    .product p {
      margin: 0;
      color: var(--body);
      font-size: 13.5px;
      line-height: 1.55;
    }
    .warn {
      display: flex;
      align-items: center;
      gap: 8px;
      color: #3a3a3a;
      font-size: 13px;
      margin-top: auto;
      padding-top: 6px;
    }
    .warn svg { width: 14px; height: 14px; flex: none; }
    .learn {
      margin-top: 6px;
      height: 42px;
      border: 0;
      border-radius: 6px;
      background: var(--btn);
      color: var(--btn-ink);
      font-size: 15px;
      font-weight: 650;
    }
    .learn:hover { background: #c5dbf8; }
    .learn:focus-visible, .nav-item:focus-visible, .user-btn:focus-visible, .eye:focus-visible, .langs button:focus-visible {
      outline: 2px solid #0e8eda;
      outline-offset: 2px;
    }

    .panel {
      background: white;
      border-radius: 8px;
      box-shadow: var(--shadow);
      padding: 28px;
      max-width: 720px;
    }
    .panel h1 {
      margin: 0 0 8px;
      font-size: 22px;
    }
    .panel p { margin: 0; color: var(--body); line-height: 1.55; }

    dialog {
      border: 0;
      padding: 0;
      border-radius: 12px;
      width: min(520px, calc(100vw - 32px));
      box-shadow: 0 24px 60px rgba(16, 24, 40, 0.22);
    }
    dialog::backdrop { background: rgba(10, 22, 40, 0.45); }
    #otp-dialog::backdrop,
    #resubmit-dialog::backdrop,
    #e-confirm-dialog::backdrop {
      background: rgba(16, 24, 40, 0.28);
      -webkit-backdrop-filter: blur(4px);
      backdrop-filter: blur(4px);
    }
    .dialog-body { padding: 22px 22px 18px; }
    .dialog-kicker {
      margin: 0 0 6px;
      color: var(--btn-ink);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .dialog-body h3 { margin: 0 0 10px; font-size: 20px; line-height: 1.35; }
    .dialog-body p { margin: 0 0 14px; color: var(--body); line-height: 1.55; font-size: 14px; }
    .facts { margin: 0 0 18px; padding: 0; list-style: none; display: grid; gap: 8px; }
    .facts li {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding: 10px 12px;
      background: #f5f8fc;
      border-radius: 8px;
      font-size: 13.5px;
    }
    .facts span { color: #667085; }
    .facts strong { font-weight: 650; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; }
    .ghost, .primary {
      height: 40px;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: 650;
      font-size: 14px;
    }
    .ghost { background: #f2f4f7; border: 0; color: #344054; }
    .primary { background: #002C76; border: 0; color: white; }
    .primary:hover { background: #001f54; }
    #otp-dialog, #resubmit-dialog, #e-confirm-dialog { width: min(440px, calc(100vw - 32px)); }
    .otp-body { padding: 28px 28px 24px; }
    #otp-dialog h3,
    #resubmit-dialog h3,
    #e-confirm-dialog h3 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #002C76;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .otp-copy {
      margin: 0 0 18px;
      text-align: center;
      color: var(--body);
      font-size: 14px;
      line-height: 1.5;
    }
    .otp-options { display: grid; gap: 10px; }
    .otp-option {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 0;
      padding: 14px;
      border: 1px solid #e6e8ec;
      border-radius: 10px;
      background: #fff;
      cursor: pointer;
      text-align: left;
    }
    .otp-option:has(input:checked) {
      border-color: #002C76;
      background: #f3f6fb;
    }
    .otp-option input {
      width: 18px;
      height: 18px;
      margin: 0;
      flex: none;
      accent-color: #002C76;
    }
    .otp-option strong { display: block; font-size: 14px; color: #1c2430; }
    .otp-mask { display: block; margin-top: 2px; font-size: 13px; font-weight: 500; color: #667085; }
    .otp-actions { display: flex; flex-direction: column; gap: 10px; margin-top: 18px; }
    .otp-digits { display: flex; justify-content: center; gap: 8px; }
    #otp-code-form .auth-demo { text-align: center; }
    .otp-digit {
      width: 46px;
      height: 54px;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      background: #fff;
      text-align: center;
      font-size: 22px;
      font-weight: 700;
      color: #002C76;
    }
    .otp-digit:focus {
      outline: none;
      border-color: #002C76;
      box-shadow: 0 0 0 3px rgba(0, 44, 118, 0.12);
    }
    .otp-digits.invalid .otp-digit { border-color: #f04438; background: #fff8f7; }
    .otp-timeout {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
      margin-top: 14px;
    }
    .otp-count {
      margin: 0;
      min-width: 76px;
      color: #002C76;
      font-size: 15px;
      font-weight: 700;
      font-variant-numeric: tabular-nums;
      text-align: right;
    }
    .otp-resend {
      border: 0;
      background: none;
      padding: 0;
      color: #002C76;
      font-size: 14px;
      font-weight: 650;
    }
    .otp-resend:disabled { color: #98a2b3; cursor: not-allowed; }
    .otp-resend:not(:disabled):hover { text-decoration: underline; }
    .otp-resent {
      margin: 10px 0 0;
      text-align: center;
      color: #067647;
      font-size: 13px;
      font-weight: 600;
    }
    .receipt-screen { width: min(680px, 100%); }
    .bank-success { width: min(860px, 100%); }
    .success-file { margin-top: 22px; text-align: left; }
    .receipt-block { margin-top: 22px; text-align: left; }
    .receipt-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }
    .receipt-head .receipt-kicker { margin: 0; text-align: left; }
    .file-download {
      width: 40px;
      height: 40px;
      padding: 0;
      border: 0;
      border-radius: 8px;
      background: #002C76;
      color: #fff;
      display: inline-grid;
      place-items: center;
      flex: none;
    }
    .file-download:hover { background: #001f54; }
    .file-download svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .receipt-screen h1,
    .receipt-screen .lede { text-align: center; }
    .receipt-screen h1 { color: #002C76; }
    .success-mark {
      width: 56px;
      height: 56px;
      margin: 0 auto 14px;
      border-radius: 50%;
      background: #e8f7ee;
      color: #067647;
      display: grid;
      place-items: center;
    }
    .success-mark svg {
      width: 28px;
      height: 28px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .receipt-kicker {
      margin: 18px 0 0;
      text-align: center;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: #667085;
    }
    .receipt-actions { flex-direction: column; align-items: stretch; }
    .download-btn, #download-receipt {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .download-btn svg, #download-receipt svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .auth-screen { width: min(520px, 100%); }
    .auth-card .auth-body { padding: 4px 8px 0; text-align: center; }
    .auth-mark {
      width: 48px;
      height: 48px;
      margin: 0 auto 14px;
      border-radius: 12px;
      background: #f3f6fb;
      color: #002C76;
      display: grid;
      place-items: center;
    }
    .auth-mark svg {
      width: 22px;
      height: 22px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.8;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .auth-card h1 {
      margin: 0 0 8px;
      font-size: 22px;
      color: #002C76;
      letter-spacing: -0.02em;
      text-align: center;
    }
    .auth-copy {
      margin: 0 auto 20px;
      max-width: 400px;
      color: var(--body);
      font-size: 14px;
      line-height: 1.55;
    }
    .auth-label-row {
      display: flex;
      justify-content: space-between;
      align-items: baseline;
      gap: 12px;
      margin-bottom: 6px;
      font-size: 13px;
      font-weight: 650;
      color: #344054;
      text-align: left;
    }
    .auth-link {
      border: 0;
      background: none;
      padding: 0;
      color: #002C76;
      font-size: 13px;
      font-weight: 650;
    }
    .auth-link:hover { text-decoration: underline; }
    .auth-field { position: relative; text-align: left; }
    .auth-field input {
      width: 100%;
      height: 44px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      padding: 0 44px 0 12px;
      font: inherit;
      font-weight: 500;
      color: var(--ink);
      background: #fff;
    }
    .auth-field input:focus { outline: 2px solid rgba(0, 44, 118, 0.35); outline-offset: 1px; }
    .auth-field.invalid input { border-color: #d92d20; background: #fff6f6; }
    .auth-eye {
      position: absolute;
      top: 0;
      right: 0;
      width: 44px;
      height: 44px;
      border: 0;
      background: transparent;
      color: #667085;
      display: grid;
      place-items: center;
    }
    .auth-eye svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .auth-eye .eye-off { display: none; }
    .auth-eye.is-visible .eye-open { display: none; }
    .auth-eye.is-visible .eye-off { display: block; }
    .auth-error { margin: 6px 0 0; text-align: left; color: #b42318; font-size: 13px; font-weight: 500; }
    .auth-attempts {
      display: flex;
      align-items: flex-start;
      gap: 8px;
      margin: 12px 0 0;
      text-align: left;
      color: #667085;
      font-size: 13px;
      font-weight: 500;
      line-height: 1.45;
    }
    .auth-attempts svg {
      width: 16px;
      height: 16px;
      flex: none;
      margin-top: 1px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.7;
      stroke-linecap: round;
      stroke-linejoin: round;
    }
    .auth-forget-note {
      margin: 10px 0 0;
      text-align: left;
      padding: 10px 12px;
      border-radius: 8px;
      background: #e8f3fc;
      color: #0b4f92;
      font-size: 13px;
      line-height: 1.45;
    }
    .auth-actions {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 12px;
      margin-top: 22px;
    }
    .auth-buttons { width: 100%; }
    .auth-demo {
      margin: 0;
      text-align: left;
      color: #0b4f92;
      font-size: 13px;
      font-weight: 650;
      line-height: 1.4;
    }
    .auth-demo strong { font-weight: 800; }
    .auth-cancel {
      height: 44px;
      padding: 0 18px;
      border: 1px solid #d8dee8;
      border-radius: 8px;
      background: #fff;
      color: #344054;
      font-size: 15px;
      font-weight: 650;

    function requestText() { return requestCopy[state.lang]; }

    function emptyEmbassyDraft() {
      return { account: "", fromDate: "", toDate: "", chargeAccount: "", country: "", purpose: "", remark: "" };
    }

    function emptyBankDraft() {
      return { account: "", fromDate: "", toDate: "", chargeAccount: "", remark: "" };
    }

    function emptyEDraft() {
      return { account: "", chargeAccount: "", frequency: "", weekday: "", periodType: "", period: "" };
    }

    function isoDate(date) {
      const month = String(date.getMonth() + 1).padStart(2, "0");
      const day = String(date.getDate()).padStart(2, "0");
      return `${date.getFullYear()}-${month}-${day}`;
    }

    function yesterdayIso() {
      const date = new Date();
      date.setHours(0, 0, 0, 0);
      date.setDate(date.getDate() - 1);
      return isoDate(date);
    }

    function formatIso(iso) {
      if (!iso) return "";
      const [year, month, day] = iso.split("-");
      const months = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
      return `${Number(day)} ${months[Number(month) - 1]} ${year}`;
    }

    function money(amount, currency) {
      const value = Number(amount).toLocaleString("en-US", { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      return `${value} ${currency}`;
    }

    function accountById(id) {
      return bankAccounts.find((item) => item.id === id);
    }

    function accountByNumber(value) {
      const number = String(value || "").split(" ")[0];
      if (!number) return null;
      return bankAccounts.find((item) => item.number === number) || null;
    }

    function draftFromHistory(item) {
      const primary = accountByNumber(item.accountNumber);
      const charge = accountByNumber(item.chargeAccount);
      return {
        account: primary ? primary.id : "",
        fromDate: item.fromDate || "",
        toDate: item.toDate || "",
        chargeAccount: charge ? charge.id : (primary && primary.type === "LCY" ? primary.id : ""),
        country: item.countryId || item.embassyId || "",
        purpose: item.purposeId || "",
        remark: item.remark || ""
      };
    }

    function statementAccounts() {
      return bankAccounts.filter((item) => item.status === "active");
    }

    function lcyChargeAccounts() {
      return bankAccounts.filter((item) => item.status === "active" && item.type === "LCY" && item.individual);
    }

    function resolvedCharge(draft) {
      const primary = accountById(draft.account);
      if (!primary) return null;
      if (primary.type === "LCY") return primary;
      return accountById(draft.chargeAccount) || null;
    }

    function chargeIssues(account) {
      if (!account) return [];
      const issues = [];
      if (account.balance < SERVICE_CHARGE) issues.push("msg008");
      if (account.balance < MIN_BALANCE) issues.push("msg009");
      return issues;
    }

    function inquiryBlocked() {
      const charge = resolvedCharge(state.embassyDraft);
      return !!(charge && chargeIssues(charge).length);
    }

    function visibleAlerts() {
      const alerts = [...state.embassyAlerts];
      const charge = resolvedCharge(state.embassyDraft);
      if (charge) {
        chargeIssues(charge).forEach((key) => {
          if (!alerts.includes(key)) alerts.push(key);
        });
      }
      return alerts;
    }

    function periodBounds(type) {
      return type === "year" ? [1, 5] : [1, 12];
    }

    function statementDay(date) {
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      return `${String(date.getDate()).padStart(2, "0")}${months[date.getMonth()]}${String(date.getFullYear()).slice(-2)}`;
    }

    function statementDayFromIso(iso) {
      if (!iso) return "";
      const [year, month, day] = iso.split("-");
      const months = ["JAN", "FEB", "MAR", "APR", "MAY", "JUN", "JUL", "AUG", "SEP", "OCT", "NOV", "DEC"];
      return `${day}${months[Number(month) - 1]}${year.slice(-2)}`;
    }

    function subscriptionStart() {
      const date = new Date();
      date.setHours(12, 0, 0, 0);
      return date;
    }

    function subscriptionEnd(periodType, period) {
      return subscriptionEndFrom(isoDate(subscriptionStart()), periodType, period);
    }

    function subscriptionEndFrom(startIso, periodType, period) {
      const count = Number(period);
      if (!startIso || (periodType !== "month" && periodType !== "year") || !count) return null;
      const [year, month, day] = startIso.slice(0, 10).split("-").map(Number);
      if (!year || !month || !day) return null;
      const date = new Date(year, month - 1, day, 12);
      if (periodType === "year") date.setFullYear(date.getFullYear() + count);
      else date.setMonth(date.getMonth() + count);
      return date;
    }

    function ePeriodUnit(text, periodType, period) {
      const count = Number(period) || 1;
      if (periodType === "year") return count === 1 ? text.year : text.years;
      if (periodType === "month") return count === 1 ? text.month : text.months;
      return "";
    }

    function ePeriodLabel(text, periodType, period) {
      const count = Number(period);
      const unit = ePeriodUnit(text, periodType, count);
      return count && unit ? `${count} ${unit}` : "";
    }

    function eFrequencyLabel(text, frequency) {
      if (frequency === "monthly") return text.monthly;
      if (frequency === "weekly") return text.weekly;
      if (frequency === "daily") return text.daily;
      return "";
    }

    function eWeekdayLabel(text, id) {
      const day = (text.weekdays || []).find((item) => item.id === id);
      return day ? day.label : "";
    }

    function activeEFrequency(frequency, exceptReference) {
      return state.eHistory.some((item) => item.status === "active" && item.frequency === frequency && item.reference !== exceptReference);
    }

                  ${feeChoices}

              <h2 class="form-section">${escapeHtml(text.scheduleTitle)}</h2>
              <div class="field span-2${eFieldClass("frequency")}">

    function syncEDraftFromForm(form) {
      const data = new FormData(form);
      const draft = state.eDraft;
      draft.account = data.get("account") || "";
      draft.frequency = data.get("frequency") || "";
      draft.periodType = data.get("periodType") || "";
      const primary = accountById(draft.account);
      if (primary && primary.type === "LCY") draft.chargeAccount = primary.id;
      else draft.chargeAccount = data.get("chargeAccount") || "";
      if (draft.frequency !== "weekly") draft.weekday = "";
      if (!draft.periodType) {
        draft.period = "";
        return;
      }
      const bounds = periodBounds(draft.periodType);
      let value = Number(data.get("period"));
      if (!data.get("period") || Number.isNaN(value)) value = 1;
      draft.period = String(Math.min(bounds[1], Math.max(bounds[0], value)));
    }

    function validateERequest() {
      const draft = state.eDraft;
      const errors = {};
      const alerts = [];
      if (!draft.account) errors.account = true;
      if (!resolvedCharge(draft)) errors.chargeAccount = true;
      if (!draft.frequency) errors.frequency = true;
      if (draft.frequency === "weekly" && !draft.weekday) errors.weekday = true;
      if (!draft.periodType) errors.periodType = true;
      const bounds = periodBounds(draft.periodType);
      const period = Number(draft.period);
      if (!draft.period || Number.isNaN(period) || period < bounds[0] || period > bounds[1]) errors.period = true;
      if (Object.keys(errors).length) alerts.push("msg007");
      else if (draft.frequency && activeEFrequency(draft.frequency)) {
        errors.frequency = true;
        alerts.push("freqLimit");
      }
      state.eFieldErrors = errors;
      state.eAlerts = alerts;
      return alerts.length === 0;
    }

    function bindEForm() {
      const back = document.getElementById("e-form-back");
      if (back) {
        back.addEventListener("click", () => {
          state.eView = "welcome";
          render();
        });
      }
      const form = document.getElementById("e-form");
      form.addEventListener("change", () => {
        syncEDraftFromForm(form);
        state.eAlerts = [];
        state.eFieldErrors = {};
        render();
      });
      form.querySelectorAll("[data-step]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          syncEDraftFromForm(form);
          const bounds = periodBounds(state.eDraft.periodType);
          const current = Number(state.eDraft.period) || bounds[0];
          state.eDraft.period = String(Math.min(bounds[1], Math.max(bounds[0], current + Number(btn.dataset.step))));
          state.eAlerts = [];
          state.eFieldErrors = {};
          render();
        });
      });
      form.querySelectorAll("[data-weekday]").forEach((btn) => {
        btn.addEventListener("click", () => {
          syncEDraftFromForm(form);
          state.eDraft.frequency = "weekly";
          state.eDraft.weekday = btn.dataset.weekday;
          state.eAlerts = [];
          state.eFieldErrors = {};
          render();
        });
      });
      document.getElementById("e-cancel").addEventListener("click", () => {
        state.eDraft = emptyEDraft();
        state.eAlerts = [];
        state.eFieldErrors = {};
        render();
      });
      form.addEventListener("submit", (event) => {
        event.preventDefault();
        syncEDraftFromForm(form);
        if (!validateERequest()) {
          render();
          return;
        }
        state.eAlerts = [];
        state.eFieldErrors = {};
        state.eView = "confirm";
        render();
      });
    }

    function eConfirmRows(text, draft) {
      const primary = accountById(draft.account);
      const charge = resolvedCharge(draft);
      const end = draft.endDate ? statementDayFromIso(draft.endDate) : (() => {
        const date = subscriptionEnd(draft.periodType, draft.period);
        return date ? statementDay(date) : "";
      })();
      const start = draft.startDate ? statementDayFromIso(draft.startDate) : statementDay(subscriptionStart());
      const rows = [
        [text.account, primary ? `${primary.number} (${primary.currency})` : ""],
        [text.name, primary ? primary.name : ""],
        [text.feeAccount, charge ? `${charge.number} (${charge.currency})` : ""],
        [text.charges, `${money(E_STATEMENT_CHARGE, "MMK")} · ${text.chargeHint}`],
        [text.frequency, eFrequencyLabel(text, draft.frequency)]
      ];
      if (draft.frequency === "monthly") rows.push([text.dayOfMonth, text.dayOfMonthValue]);
      if (draft.frequency === "weekly") rows.push([text.dayOfWeek, eWeekdayLabel(text, draft.weekday)]);
      if (draft.frequency === "daily") rows.push([text.dailyMode, text.dailyModeValue]);
      rows.push(
        [text.periodType, draft.periodType === "year" ? text.year : text.month],
        [text.period, ePeriodLabel(text, draft.periodType, draft.period)],
        [text.startDate, start],
        [text.endDate, end],
        [text.email, E_STATEMENT_EMAIL]
      );
      return rows;
    }

    function bindEAuth() {
      const input = document.getElementById("auth-password");
      const text = eCopy();
      document.getElementById("auth-back").addEventListener("click", () => {
        clearAuth();
        state.eView = "confirm";
        render();
      });
      document.getElementById("auth-eye").addEventListener("click", () => {
        state.authShow = !state.authShow;
        state.authPassword = input.value;

        input.type = state.authShow ? "text" : "password";

      document.getElementById("auth-forget").addEventListener("click", () => {
        state.authForget = !state.authForget;
        state.authPassword = input.value;
        document.getElementById("auth-forget-note").hidden = !state.authForget;
      });
      input.addEventListener("input", () => {
        state.authPassword = input.value;
        state.authError = false;
        input.closest(".auth-field").classList.remove("invalid");
        document.getElementById("auth-error").hidden = true;
      });
      document.getElementById("auth-form").addEventListener("submit", (event) => {
        event.preventDefault();
        state.authPassword = input.value;
        const password = input.value.trim();
        const error = document.getElementById("auth-error");
        const showError = (key) => {
          state.authError = key;
          input.closest(".auth-field").classList.add("invalid");
          error.hidden = false;
          const message = key === "wrong" ? text.authWrong : text.authRequired;
          error.textContent = message.replace("{password}", DEMO_PASSWORD);
          input.focus();
        };
        if (!password) {
          showError("required");
          return;
        }
        if (password !== DEMO_PASSWORD) {
          showError("wrong");
          return;
        }
        openOtpDialog();
      });

    function bindEOtp() {
      const boxes = [...document.querySelectorAll(".otp-digit")];
      const error = document.getElementById("otp-code-error");
      const text = eCopy();
      const hideError = () => {
        state.otpError = "";
        state.otpResent = false;
        document.getElementById("otp-digits").classList.remove("invalid");
        error.hidden = true;
        const note = document.getElementById("otp-resent");
        if (note) note.hidden = true;
      };
      document.getElementById("otp-back").addEventListener("click", () => {
        clearOtp();
        state.eView = "auth";
        render();
      });
      boxes.forEach((box, index) => {
        box.addEventListener("input", () => {
          const digit = box.value.replace(/\D/g, "").slice(-1);
          box.value = digit;
          state.otpCode = readOtpDigits(boxes);
          hideError();
          if (digit && boxes[index + 1]) boxes[index + 1].focus();
        });
        box.addEventListener("keydown", (event) => {
          if (event.key === "Backspace" && !box.value && boxes[index - 1]) {
            boxes[index - 1].value = "";
            boxes[index - 1].focus();
            state.otpCode = readOtpDigits(boxes);
            hideError();
          }
          if (event.key === "ArrowLeft" && boxes[index - 1]) boxes[index - 1].focus();
          if (event.key === "ArrowRight" && boxes[index + 1]) boxes[index + 1].focus();
        });
        box.addEventListener("paste", (event) => {
          event.preventDefault();
          const pasted = (event.clipboardData.getData("text") || "").replace(/\D/g, "").slice(0, 6);
          pasted.split("").forEach((digit, digitIndex) => {
            if (boxes[digitIndex]) boxes[digitIndex].value = digit;
          });
          state.otpCode = readOtpDigits(boxes);
          hideError();
          const next = boxes[Math.min(pasted.length, boxes.length - 1)];
          if (next) next.focus();
        });
      });
      document.getElementById("otp-resend").addEventListener("click", () => {
        if (otpSecondsLeft() > 0) return;
        state.otpDeadline = Date.now() + OTP_TIMEOUT * 1000;
        state.otpCode = "";
        state.otpError = "";
        state.otpResent = true;
        boxes.forEach((box) => { box.value = ""; });
        document.getElementById("otp-digits").classList.remove("invalid");
        error.hidden = true;
        const note = document.getElementById("otp-resent");
        note.hidden = false;
        note.textContent = text.otpResent;
        startOtpTimer();
        boxes[0].focus();
      });
      document.getElementById("otp-code-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const code = readOtpDigits(boxes);
        state.otpCode = code;
        if (code.length < 6) {
          state.otpError = "required";
          render();
          return;
        }
        if (code !== DEMO_OTP) {
          state.otpError = "wrong";
          render();
          return;
        }
        const channel = state.otpChannel;
        clearOtp();
        completeESubscribe(channel);
      });
      if (!state.otpDeadline) state.otpDeadline = Date.now() + OTP_TIMEOUT * 1000;
      startOtpTimer();
      const firstEmpty = boxes.find((box) => !box.value) || boxes[0];
      if (firstEmpty) firstEmpty.focus();
    }

    function completeESubscribe(channel) {
      if (!validateERequest()) {
        state.eView = "form";
        render();
        return;
      }
      const draft = state.eDraft;
      const primary = accountById(draft.account);
      const charge = resolvedCharge(draft);
      const sentAt = new Date().toISOString();
      const end = subscriptionEnd(draft.periodType, draft.period);
      state.eRequest = {
        reference: nextEReference(),
        transactionRef: transactionReference(sentAt),
        status: "active",
        accountNumber: primary ? `${primary.number} (${primary.currency})` : "",
        name: primary ? primary.name : "",
        chargeAccount: charge ? `${charge.number} (${charge.currency})` : "",
        frequency: draft.frequency,
        weekday: draft.weekday,
        periodType: draft.periodType,
        period: draft.period,
        startDate: isoDate(subscriptionStart()),
        endDate: end ? isoDate(end) : "",
        email: REGISTERED_EMAIL,
        channel: channel || state.otpChannel || "email",
        sentAt
      };
      state.eHistory.unshift(state.eRequest);
      saveEHistory();
      state.eDraft = emptyEDraft();
      state.eAlerts = [];
      state.eFieldErrors = {};
      state.eView = "success";
      render();
    }

    function eReceiptRows(item, text = eCopy()) {
      const channelName = item.channel === "sms" ? text.otpSms : text.otpEmail;

      const rows = [
        [text.receiptTxnRef, item.transactionRef],
        [text.receiptSubmitted, formatSubmittedAt(item.sentAt)],
        [text.receiptRef, item.reference],
        [text.receiptStatus, eStatusText(item, text)],
        [text.name, item.name],
        [text.account, item.accountNumber],
        [text.feeAccount, item.chargeAccount],
        [text.charges, money(E_STATEMENT_CHARGE, "MMK")],
        [text.frequency, eFrequencyLabel(text, item.frequency)]
      ];
      if (item.frequency === "weekly") rows.push([text.dayOfWeek, eWeekdayLabel(text, item.weekday)]);
      rows.push(
        [text.periodType, item.periodType === "year" ? text.year : text.month],
        [text.period, ePeriodLabel(text, item.periodType, item.period)],
        [text.startDate, formatIso(item.startDate)],
        [text.endDate, formatIso(item.endDate)],
        [text.email, E_STATEMENT_EMAIL],
        [text.receiptChannel, `${channelName} · ${channelValue}`]
      );
      return rows;
    }

    }

    function nextEReference() {
      const max = state.eHistory.reduce((highest, item) => {
        const match = String(item.reference || "").match(/^EE-(\d+)$/);
        return match ? Math.max(highest, Number(match[1])) : highest;
      }, 0);
      return `EE-${String(max + 1).padStart(3, "0")}`;
    }

    function filteredEHistory() {
      const filters = state.eHistoryFilters;
      const txn = filters.transactionRef.trim().toLowerCase();
      return state.eHistory.filter((item) => {
        const day = appliedDay(item.sentAt);
        if (filters.appliedFrom && day < filters.appliedFrom) return false;
        if (filters.appliedTo && day > filters.appliedTo) return false;
        const txnValue = `${item.transactionRef || ""} ${item.reference || ""}`.toLowerCase();
        if (txn && !txnValue.includes(txn)) return false;
        if (filters.accountNumber && item.accountNumber !== filters.accountNumber) return false;
        return true;
      });
    }

    function eHistoryFiltersHtml(copyText) {
      const filters = state.eHistoryFilters;
      const active = filters.appliedFrom || filters.appliedTo || filters.transactionRef || filters.accountNumber;
      return `
        <form class="history-filters" id="e-history-filters">
          <label>${escapeHtml(copyText.filterRange)}
            <span class="date-range">
              <input id="e-filter-from" name="appliedFrom" type="date" max="${escapeHtml(filters.appliedTo)}" value="${escapeHtml(filters.appliedFrom)}" />
              <input id="e-filter-to" name="appliedTo" type="date" min="${escapeHtml(filters.appliedFrom)}" value="${escapeHtml(filters.appliedTo)}" />
            </span>
          </label>
          <label>${escapeHtml(copyText.filterTxn)}
            <input id="e-filter-txn" name="transactionRef" type="search" placeholder="${escapeHtml(copyText.filterTxnPh)}" value="${escapeHtml(filters.transactionRef)}" />
          </label>
          <label>${escapeHtml(copyText.filterAccount)}
            <select id="e-filter-account" name="accountNumber">${accountFilterOptions(filters.accountNumber, state.eHistory, copyText.allAccounts)}</select>
          </label>
        </form>
        ${active ? `<div class="filter-clear"><button class="history-link" type="button" id="e-clear-filters">${escapeHtml(copyText.clearFilters)}</button></div>` : ""}`;
    }

    function slashDate(iso) {
      if (!iso || !/^\d{4}-\d{2}-\d{2}/.test(iso)) return "";
      const [year, month, day] = iso.slice(0, 10).split("-");
      return `${day}/${month}/${year.slice(2)}`;
    }

    function ePeriodCell(item, text) {
      const label = ePeriodLabel(text, item.periodType, item.period);
      const start = slashDate(item.startDate || item.fromDate);
      const end = slashDate(item.endDate || item.toDate);
      const range = start && end
        ? `<span class="period-range">${escapeHtml(start)} -<br>${escapeHtml(end)}</span>`
        : "";
      if (!label && !range) return "—";
      return `<div class="period-cell">${label ? `<strong>${escapeHtml(label)}</strong>` : ""}${range}</div>`;
    }

    function eStatusText(item, text) {
      if (item.status === "inactive") return text.statusInactive;
      if (item.modified) return `${text.statusActive} · ${text.statusModified}`;
      return text.statusActive;
    }

    function eStatusHtml(item, text) {
      if (item.status === "inactive") {
        return `<span class="status-pill status-inactive">${escapeHtml(text.statusInactive)}</span>`;
      }
      const active = `<span class="status-pill status-active">${escapeHtml(text.statusActive)}</span>`;
      if (!item.modified) return active;
      return `<span class="status-pills">${active}<span class="status-pill status-modified">${escapeHtml(text.statusModified)}</span></span>`;
    }

    function eActionHtml(item, text) {
      const inactive = item.status === "inactive";
      const modifyOff = inactive || item.modified ? "disabled" : "";
      const deactivateOff = inactive ? "disabled" : "";
      return `<div class="kebab">
        <button class="kebab-btn" type="button" aria-haspopup="menu" aria-expanded="false" aria-label="${escapeHtml(text.action)}">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="12" cy="19" r="1.7"/></svg>
        </button>
        <div class="kebab-menu" role="menu" hidden>
          <button type="button" role="menuitem" data-e-detail="${escapeHtml(item.reference)}">${escapeHtml(text.viewDetails)}</button>
          <button type="button" role="menuitem" data-e-modify="${escapeHtml(item.reference)}" ${modifyOff}>${escapeHtml(text.modifySchedule)}</button>
          <button type="button" role="menuitem" data-e-deactivate="${escapeHtml(item.reference)}" ${deactivateOff}>${escapeHtml(text.deactivate)}</button>
        </div>
      </div>`;
    }

    function closeKebabs() {
      document.querySelectorAll(".kebab-menu").forEach((menu) => { menu.hidden = true; });
      document.querySelectorAll(".kebab-btn[aria-expanded='true']").forEach((btn) => btn.setAttribute("aria-expanded", "false"));
    }

    function openKebab(btn) {
      const menu = btn.parentElement.querySelector(".kebab-menu");
      const wasOpen = btn.getAttribute("aria-expanded") === "true";
      closeKebabs();
      if (!menu || wasOpen) return;
      menu.hidden = false;
      btn.setAttribute("aria-expanded", "true");
      const rect = btn.getBoundingClientRect();
      const menuRect = menu.getBoundingClientRect();
      let top = rect.bottom + 6;
      if (top + menuRect.height > window.innerHeight - 8) top = Math.max(8, rect.top - menuRect.height - 6);
      let left = rect.right - menuRect.width;
      if (left < 8) left = 8;
      if (left + menuRect.width > window.innerWidth - 8) left = window.innerWidth - menuRect.width - 8;
      menu.style.top = `${top}px`;
      menu.style.left = `${left}px`;
    }

    function eHistory(copyText) {
      const all = state.eHistory;
      const items = filteredEHistory();
      const pages = Math.max(1, Math.ceil(items.length / HISTORY_PAGE_SIZE));
      if (state.eHistoryPage > pages) state.eHistoryPage = pages;
      if (state.eHistoryPage < 1) state.eHistoryPage = 1;
      const start = (state.eHistoryPage - 1) * HISTORY_PAGE_SIZE;
      const pageItems = items.slice(start, start + HISTORY_PAGE_SIZE);
      const rows = pageItems.map((item) => `<tr>
          <td class="txn">${escapeHtml(item.transactionRef || item.reference || "—")}</td>
          <td>${escapeHtml(item.accountNumber || "—")}</td>
          <td class="nowrap">${escapeHtml(item.frequency ? eFrequencyLabel(copyText, item.frequency) : "—")}</td>
          <td class="period-col">${ePeriodCell(item, copyText)}</td>
          <td class="nowrap">${escapeHtml(formatIso(item.startDate || item.fromDate) || "—")}</td>
          <td class="nowrap">${escapeHtml(formatIso(item.endDate || item.toDate) || "—")}</td>
          <td class="status-col">${eStatusHtml(item, copyText)}</td>
          <td class="action-col">${eActionHtml(item, copyText)}</td>
        </tr>`).join("");
      const filters = all.length ? eHistoryFiltersHtml(copyText) : "";
      const list = !all.length
        ? `<div class="empty-history"><p>${copyText.emptyHistory}</p></div>`
        : items.length
          ? `<div class="table-wrap"><table class="history-table"><colgroup><col style="width:18%"><col style="width:16%"><col style="width:12%"><col style="width:13%"><col style="width:12%"><col style="width:12%"><col style="width:11%"><col style="width:6%"></colgroup><thead><tr>
              <th>${escapeHtml(copyText.filterTxn)}</th>
              <th>${escapeHtml(copyText.account)}</th>
              <th>${escapeHtml(copyText.frequency)}</th>
              <th>${escapeHtml(copyText.period)}</th>
              <th>${escapeHtml(copyText.startDate)}</th>
              <th>${escapeHtml(copyText.endDate)}</th>
              <th>${escapeHtml(copyText.receiptStatus)}</th>
              <th>${escapeHtml(copyText.action)}</th>
            </tr></thead><tbody>${rows}</tbody></table></div>${historyPager(copyText, items.length, state.eHistoryPage, pages)}`
          : `<p class="history-empty-filter">${escapeHtml(copyText.noFilterMatch)}</p>`;
      return `
        <div class="page-top">${backButton("e-home")}</div>
        <section class="embassy history-wide">
          <article class="history-card">
            <h1>${copyText.historyTitle}</h1>
            <p class="lede">${copyText.historyBody}</p>
            ${filters}
            ${list}
          </article>
        </section>`;
    }

    function eDetail(copyText) {
      const item = state.eHistory.find((entry) => entry.reference === state.eHistoryDetail);
      if (!item) {
        state.eView = "history";
        return eHistory(copyText);
      }
      const rows = item.frequency
        ? [[copyText.filterTxn, item.transactionRef || "—"]].concat(eConfirmRows(copyText, {
          account: (accountByNumber(item.accountNumber) || {}).id || "",
          chargeAccount: (accountByNumber(item.chargeAccount) || {}).id || "",
          frequency: item.frequency,
          weekday: item.weekday,
          periodType: item.periodType,
          period: item.period,
          startDate: item.startDate,
          endDate: item.endDate
        }))
        : [
          [copyText.filterTxn, item.transactionRef || "—"],
          [copyText.account, item.accountNumber],
          [copyText.name, item.name],
          [copyText.email, E_STATEMENT_EMAIL]
        ];
      const list = rows.map(([label, value]) =>
        `<div class="confirm-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "—")}</strong></div>`
      ).join("");
      return `
        <div class="page-top">${backButton("e-detail-back")}</div>
        <section class="embassy detail-wide">
          <article class="history-card">
            <div class="detail-head">
              <h1>${escapeHtml(copyText.detailsTitle)}</h1>
              <button class="file-download" type="button" id="e-detail-download" aria-label="${escapeHtml(copyText.downloadReceipt)}">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v11"/><path d="m7 11 5 5 5-5"/><path d="M5 19h14"/></svg>
              </button>
            </div>
            <p class="lede">${escapeHtml(copyText.detailsBody)}</p>
            <div class="confirm-list">${list}</div>
          </article>
        </section>`;
    }

    function eModifyItem() {
      return state.eHistory.find((item) => item.reference === state.eModifyRef) || null;
    }

    function fillEModifyDialog() {
      const text = eCopy();
      const item = eModifyItem();
      const draft = state.eModifyDraft;
      const fields = document.getElementById("e-modify-fields");
      if (!item || !draft || !fields) return;
      document.getElementById("e-modify-title").textContent = text.modifyTitle;
      document.getElementById("e-modify-copy").textContent = text.modifyBody.replace("{reference}", item.reference);
      document.getElementById("e-modify-save").textContent = text.modifySave;
      document.getElementById("e-modify-cancel").textContent = text.cancel;
      const error = document.getElementById("e-modify-error");
      error.hidden = !state.eModifyError;
      error.textContent = state.eModifyError ? (text[state.eModifyError] || "") : "";
      const invalid = state.eModifyError === "msg007";
      const freqInvalid = invalid && !draft.frequency || state.eModifyError === "freqLimit";
      const captions = { monthly: text.monthlyCaption, weekly: text.weeklyCaption, daily: text.dailyCaption };
      const frequencies = ["monthly", "weekly", "daily"].map((id) =>
        `<label class="freq-card${draft.frequency === id ? " is-selected" : ""}">
          <input type="radio" name="frequency" value="${id}" ${draft.frequency === id ? "checked" : ""} />
          <span class="freq-copy">
            <span class="freq-title">${escapeHtml(text[id])}</span>
            <span class="freq-sub">${escapeHtml(captions[id])}</span>
          </span>
        </label>`
      ).join("");
      const weekday = draft.frequency === "weekly"
        ? `<div class="field span-2${invalid && !draft.weekday ? " invalid" : ""}">
            <span class="field-label"><span>${escapeHtml(text.dayOfWeek)} <span class="req">*</span></span></span>
            <div class="weekday-group" role="radiogroup" aria-label="${escapeHtml(text.dayOfWeek)}">${text.weekdays.map((day) =>
              `<button class="day-toggle${draft.weekday === day.id ? " is-selected" : ""}" type="button" data-weekday="${day.id}" aria-pressed="${draft.weekday === day.id}">${escapeHtml(day.label)}</button>`
            ).join("")}</div>
            <p class="hint">${escapeHtml(text.weekHint)}</p>
          </div>`
        : "";
      const bounds = periodBounds(draft.periodType);
      const end = subscriptionEndFrom(item.startDate, draft.periodType, draft.period);
      const unit = draft.periodType ? ePeriodUnit(text, draft.periodType, draft.period || 1) : "";
      fields.innerHTML = `
        <label class="field span-2">
          <span class="field-label"><span>${escapeHtml(text.account)}</span></span>
          <input value="${escapeHtml(item.accountNumber || "")}" readonly />
        </label>
        <div class="field span-2${freqInvalid ? " invalid" : ""}">
          <span class="field-label"><span>${escapeHtml(text.frequency)} <span class="req">*</span></span></span>
          <div class="freq-row">${frequencies}</div>
        </div>
        ${weekday}
        <label class="field${invalid && !draft.periodType ? " invalid" : ""}">
          <span class="field-label"><span>${escapeHtml(text.periodType)} <span class="req">*</span></span></span>
          <select name="periodType">
            <option value="">${escapeHtml(text.selectPeriodType)}</option>
            <option value="month" ${draft.periodType === "month" ? "selected" : ""}>${escapeHtml(text.month)}</option>
            <option value="year" ${draft.periodType === "year" ? "selected" : ""}>${escapeHtml(text.year)}</option>
          </select>
        </label>
        <div class="field${invalid && !draft.period ? " invalid" : ""}">
          <span class="field-label"><span>${escapeHtml(text.period)} <span class="req">*</span></span></span>
          <div class="stepper">
            <button class="step-btn" type="button" data-step="-1" aria-label="${escapeHtml(text.decrease)}" ${!draft.periodType || Number(draft.period) <= bounds[0] ? "disabled" : ""}>−</button>
            <input name="period" type="number" inputmode="numeric" min="${bounds[0]}" max="${bounds[1]}" value="${escapeHtml(draft.period)}" ${draft.periodType ? "" : "disabled"} />
            ${unit ? `<span class="step-unit">${escapeHtml(unit)}</span>` : ""}
            <button class="step-btn" type="button" data-step="1" aria-label="${escapeHtml(text.increase)}" ${!draft.periodType || Number(draft.period) >= bounds[1] ? "disabled" : ""}>+</button>
          </div>
        </div>
        <label class="field">
          <span class="field-label"><span>${escapeHtml(text.startDate)}</span></span>
          <input value="${escapeHtml(statementDayFromIso(item.startDate) || "")}" readonly />
        </label>
        <label class="field">
          <span class="field-label"><span>${escapeHtml(text.endDate)}</span></span>
          <input value="${end ? escapeHtml(statementDay(end)) : ""}" readonly />
          <p class="hint">${escapeHtml(text.autoStatus)}</p>
        </label>`;
    }

    function fillEConfirm() {
      const text = eCopy();
      const kind = state.eConfirmKind;
      document.getElementById("e-confirm-title").textContent = kind === "modify" ? text.modifyOnceTitle : text.deactivateTitle;
      document.getElementById("e-confirm-copy").textContent = kind === "modify" ? text.modifyOnceBody : text.deactivateBody;
      document.getElementById("e-confirm-ok").textContent = text.confirm;
      document.getElementById("e-confirm-cancel").textContent = text.cancel;
    }

    function openEConfirm(kind, reference) {
      state.eConfirmKind = kind;
      state.eConfirmRef = reference || state.eModifyRef;
      fillEConfirm();
      const dialog = document.getElementById("e-confirm-dialog");
      if (!dialog.open) dialog.showModal();
    }

    function applyEModify() {
      const item = eModifyItem();
      const draft = state.eModifyDraft;
      if (!item || !draft || item.status === "inactive" || item.modified) return;
      const end = subscriptionEndFrom(item.startDate, draft.periodType, draft.period);
      item.frequency = draft.frequency;
      item.weekday = draft.frequency === "weekly" ? draft.weekday : "";
      item.periodType = draft.periodType;
      item.period = String(draft.period);
      if (end) item.endDate = isoDate(end);
      item.status = "active";
      item.modified = true;
      saveEHistory();
      state.eModifyRef = "";
      state.eModifyDraft = null;
      state.eModifyError = "";
      const dialog = document.getElementById("e-modify-dialog");
      if (dialog.open) dialog.close();
      render();
    }

    function openEModify(reference) {
      const item = state.eHistory.find((entry) => entry.reference === reference);
      if (!item || item.status === "inactive" || item.modified) return;
      state.eModifyRef = reference;
      state.eModifyDraft = {
        frequency: item.frequency || "",
        weekday: item.weekday || "",
        periodType: item.periodType || "",
        period: item.period ? String(item.period) : ""
      };
      state.eModifyError = "";
      fillEModifyDialog();
      document.getElementById("e-modify-dialog").showModal();
    }

    function deactivateESchedule(reference) {
      const item = state.eHistory.find((entry) => entry.reference === reference);
      if (!item || item.status === "inactive") return;
      item.status = "inactive";
      saveEHistory();
      render();
    }

    function bindEHistory() {
      const home = document.getElementById("e-home");
      if (home) {
        home.addEventListener("click", () => {
          state.eView = "welcome";
          render();
        });
      }
      const filters = document.getElementById("e-history-filters");
      if (filters) {
        const applyFilters = () => {
          const active = document.activeElement;
          state.eHistoryFilterFocus = active && filters.contains(active) ? active.id : "";
          state.eHistoryFilters.appliedFrom = filters.appliedFrom.value;
          state.eHistoryFilters.appliedTo = filters.appliedTo.value;
          state.eHistoryFilters.transactionRef = filters.transactionRef.value;
          state.eHistoryFilters.accountNumber = filters.accountNumber.value;
          state.eHistoryPage = 1;
          render();
        };
        filters.addEventListener("input", applyFilters);
        filters.addEventListener("change", applyFilters);
      }
      const clear = document.getElementById("e-clear-filters");
      if (clear) {
        clear.addEventListener("click", () => {
          state.eHistoryFilters = emptyEHistoryFilters();
          state.eHistoryFilterFocus = "";
          state.eHistoryPage = 1;
          render();
        });
      }
      document.querySelectorAll(".history-pager [data-page]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          state.eHistoryPage = Number(btn.dataset.page);
          render();
        });
      });
      document.querySelectorAll(".kebab-btn").forEach((btn) => {
        btn.addEventListener("click", (event) => {
          event.stopPropagation();
          openKebab(btn);
        });
      });
      document.querySelectorAll("[data-e-detail]").forEach((btn) => {
        btn.addEventListener("click", () => {
          closeKebabs();
          state.eHistoryDetail = btn.dataset.eDetail;
          state.eView = "detail";
          render();
        });
      });
      document.querySelectorAll("[data-e-modify]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          closeKebabs();
          openEModify(btn.dataset.eModify);
        });
      });
      document.querySelectorAll("[data-e-deactivate]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          closeKebabs();
          openEConfirm("deactivate", btn.dataset.eDeactivate);
        });
      });
      if (state.eHistoryFilterFocus && state.eHistoryFilterFocus !== "e-filter-from" && state.eHistoryFilterFocus !== "e-filter-to") {
        const field = document.getElementById(state.eHistoryFilterFocus);
        if (field) {
          field.focus();
          const end = field.value.length;
          if (field.setSelectionRange && field.type !== "date") field.setSelectionRange(end, end);
        }
      }
    }

    function bindEDetail() {
      const back = document.getElementById("e-detail-back");
      if (!back) {
        bindEHistory();
        return;
      }
      back.addEventListener("click", () => {
        state.eView = "history";
        render();
      });
      const download = document.getElementById("e-detail-download");
      if (download) {
        download.addEventListener("click", () => {
          const item = state.eHistory.find((entry) => entry.reference === state.eHistoryDetail);
          downloadEReceipt(item);
        });
      }
    }

    function render() {
      stopOtpTimer();
      applyChrome();
      document.querySelectorAll(".nav-item").forEach((btn) => {
        btn.classList.toggle("active", btn.dataset.page === state.page);
      });

      if (state.page === "dashboard") {
        const masked = "************";
        view.innerHTML = `
          <p class="crumb">${t().myAccount}</p>
          <div class="account-chip">
            ${bankIcon()}
            <span class="chip-copy">
              <span class="chip-title">${t().accountName}</span>
              <span class="chip-balance ${state.reveal ? "revealed" : ""}">
                <span id="balance">${state.reveal ? state.balance : masked}</span>
                <button class="eye" id="eye" type="button" aria-pressed="${state.reveal}" aria-label="${state.reveal ? "Hide balance" : "Show balance"}">${eyeIcon(state.reveal)}</button>
              </span>
            </span>
          </div>
          <h1 class="greeting">${t().greeting}</h1>
          <section class="products">
            ${t().products.map(productCard).join("")}
          </section>`;
        bindDashboard();
        return;
      }

      if (state.page === "e-statement") {
        const copyText = eCopy();
        if (state.eView === "success") {
          view.innerHTML = eStatementSuccess();
          bindESuccess();
        } else if (state.eView === "auth") {
          view.innerHTML = bankAuth(eCopy());
          bindEAuth();
        } else if (state.eView === "otp") {
          view.innerHTML = bankOtp(eCopy());
          bindEOtp();
        } else if (state.eView === "confirm") {
          view.innerHTML = eStatementConfirm();
          bindEConfirm();
        } else if (state.eView === "detail") {
          view.innerHTML = eDetail(copyText);
          bindEDetail();
        } else if (state.eView === "history") {
          view.innerHTML = eHistory(copyText);
          bindEHistory();
        } else if (state.eView === "form") {
          view.innerHTML = eStatementForm();
          bindEForm();
        } else {
          view.innerHTML = eWelcome(copyText);
          bindEWelcome();
        }
        return;
      }

      if (state.page === "bank-statement") {
        if (state.bankView === "auth") {
          view.innerHTML = bankAuth();
          bindBankAuth();
        } else if (state.bankView === "otp") {
          view.innerHTML = bankOtp();
          bindBankOtp();
        } else if (state.bankView === "receipt") {
          view.innerHTML = bankReceiptView();
          bindBankReceipt();
        } else if (state.bankView === "detail") {
          view.innerHTML = bankDetail(bankCopy());
          bindBankDetail();
        } else if (state.bankView === "history") {
          view.innerHTML = bankHistory(bankCopy());
          bindBankHistory();
        } else if (state.bankView === "confirm") {
          view.innerHTML = bankConfirm();
          bindBankConfirm();
        } else if (state.bankView === "form") {
          view.innerHTML = bankForm();
          bindBankForm();
        } else {
          view.innerHTML = bankWelcome(bankCopy());
          bindBankWelcome();
        }
        return;
      }

      if (state.page === "embassy") {
        renderEmbassy();
        return;
      }

      const page = t().pages[state.page];
      view.innerHTML = `
        <p class="crumb">${t().myAccount}</p>
        <section class="panel">
          <h1>${page[0]}</h1>
          <p>${page[1]}</p>
        </section>`;
    }

    function renderEmbassy() {
      const copyText = embassyCopy();
      if (state.embassyView === "confirm") {
        view.innerHTML = embassyConfirm();
        bindEmbassyConfirm();
        return;
      }
      if (state.embassyView === "auth") {
        view.innerHTML = embassyAuth();
        bindEmbassyAuth();
        return;
      }
      if (state.embassyView === "otp") {
        view.innerHTML = embassyOtp();
        bindEmbassyOtp();
        return;
      }
      if (state.embassyView === "receipt") {
        view.innerHTML = embassyReceiptView();
        bindEmbassyReceipt();
        return;
      }
      if (state.embassyView === "form") {
        view.innerHTML = embassyForm(copyText);
        bindEmbassyForm();
        return;
      }
      if (state.embassyView === "detail") {
        view.innerHTML = embassyDetail(copyText);
        bindEmbassyDetail();
        return;
      }
      if (state.embassyView === "history") {

    function bindBankWelcome() {
      document.getElementById("bank-apply").addEventListener("click", openBankForm);
      document.getElementById("bank-history").addEventListener("click", () => {
        state.bankHistoryAlert = false;
        state.bankView = "history";
        render();
      });
    }

    function emptyBankHistoryFilters() {
      return { appliedFrom: "", appliedTo: "", transactionRef: "", accountNumber: "" };
    }

    function filteredBankHistory() {
      const filters = state.bankHistoryFilters;
      const txn = filters.transactionRef.trim().toLowerCase();
      return state.bankHistory.filter((item) => {
        const day = appliedDay(item.sentAt);
        if (filters.appliedFrom && day < filters.appliedFrom) return false;
        if (filters.appliedTo && day > filters.appliedTo) return false;
        const txnValue = `${item.transactionRef || ""} ${item.reference || ""}`.toLowerCase();
        if (txn && !txnValue.includes(txn)) return false;
        if (filters.accountNumber && item.accountNumber !== filters.accountNumber) return false;
        return true;
      });
    }

    function accountFilterOptions(selected, history, allLabel) {
      const values = new Set();
      statementAccounts().forEach((account) => values.add(`${account.number} (${account.currency})`));
      history.forEach((item) => {
        if (item.accountNumber) values.add(item.accountNumber);
      });
      const options = [`<option value="">${escapeHtml(allLabel)}</option>`];
      values.forEach((value) => {
        options.push(`<option value="${escapeHtml(value)}" ${value === selected ? "selected" : ""}>${escapeHtml(value)}</option>`);
      });
      return options.join("");
    }

    function bankAccountFilterOptions(selected) {
      return accountFilterOptions(selected, state.bankHistory, bankCopy().allAccounts);
    }

    function bankHistoryFiltersHtml(copyText) {
      const filters = state.bankHistoryFilters;
      const active = filters.appliedFrom || filters.appliedTo || filters.transactionRef || filters.accountNumber;
      return `
        <form class="history-filters" id="bank-history-filters">
          <label>${escapeHtml(copyText.filterRange)}
            <span class="date-range">
              <input id="bank-filter-from" name="appliedFrom" type="date" max="${escapeHtml(filters.appliedTo)}" value="${escapeHtml(filters.appliedFrom)}" />
              <input id="bank-filter-to" name="appliedTo" type="date" min="${escapeHtml(filters.appliedFrom)}" value="${escapeHtml(filters.appliedTo)}" />
            </span>
          </label>
          <label>${escapeHtml(copyText.filterTxn)}
            <input id="bank-filter-txn" name="transactionRef" type="search" placeholder="${escapeHtml(copyText.filterTxnPh)}" value="${escapeHtml(filters.transactionRef)}" />
          </label>
          <label>${escapeHtml(copyText.filterAccount)}
            <select id="bank-filter-account" name="accountNumber">${bankAccountFilterOptions(filters.accountNumber)}</select>
          </label>
        </form>
        ${active ? `<div class="filter-clear"><button class="history-link" type="button" id="bank-clear-filters">${escapeHtml(copyText.clearFilters)}</button></div>` : ""}`;
    }

    function bankHistory(copyText) {
      const all = state.bankHistory;
      const items = filteredBankHistory();
      const pages = Math.max(1, Math.ceil(items.length / HISTORY_PAGE_SIZE));
      if (state.bankHistoryPage > pages) state.bankHistoryPage = pages;
      if (state.bankHistoryPage < 1) state.bankHistoryPage = 1;
      const start = (state.bankHistoryPage - 1) * HISTORY_PAGE_SIZE;
      const pageItems = items.slice(start, start + HISTORY_PAGE_SIZE);
      const rows = pageItems.map((item) => `<tr>
          <td class="txn">${escapeHtml(item.transactionRef || item.reference || "—")}</td>
          <td>${escapeHtml(item.accountNumber || "—")}</td>
          <td class="nowrap">${escapeHtml(formatIso(item.fromDate) || "—")}</td>
          <td class="nowrap">${escapeHtml(formatIso(item.toDate) || "—")}</td>
          <td class="nowrap">${escapeHtml(item.totalBalance || "—")}</td>
          <td class="nowrap"><button class="view-detail" type="button" data-bank-detail="${escapeHtml(item.reference)}">${escapeHtml(copyText.viewDetails)}</button></td>
        </tr>`).join("");
      const filters = all.length ? bankHistoryFiltersHtml(copyText) : "";
      const list = !all.length
        ? `<div class="empty-history"><p>${copyText.emptyHistory}</p></div>`
        : items.length
          ? `<div class="table-wrap"><table class="history-table"><colgroup><col style="width:22%"><col style="width:18%"><col style="width:14%"><col style="width:14%"><col style="width:16%"><col style="width:16%"></colgroup><thead><tr>

              <th>${escapeHtml(copyText.account)}</th>
              <th>${escapeHtml(copyText.from)}</th>
              <th>${escapeHtml(copyText.to)}</th>
              <th>${escapeHtml(copyText.balance)}</th>
              <th>${escapeHtml(copyText.viewDetails)}</th>
            </tr></thead><tbody>${rows}</tbody></table></div>${historyPager(copyText, items.length, state.bankHistoryPage, pages)}`
          : `<p class="history-empty-filter">${escapeHtml(copyText.noFilterMatch)}</p>`;
      return `
        <div class="page-top">${backButton("bank-home")}</div>
        <section class="embassy history-wide">
          <article class="history-card">
            <h1>${copyText.historyTitle}</h1>
            <p class="lede">${copyText.historyBody}</p>

    function bankDetailRows(item, copyText) {
      const channelName = item.channel === "sms" ? copyText.otpSms : item.channel === "email" ? copyText.otpEmail : "";
      const channelValue = item.channel === "sms" ? REGISTERED_PHONE_MASK : item.channel === "email" ? maskEmail(REGISTERED_EMAIL) : "";
      const rows = [
        [copyText.receiptTxnRef, item.transactionRef || "—"],
        [copyText.appliedAt, item.sentAt ? formatSubmittedAt(item.sentAt) : "—"],
        [copyText.referenceNo, item.reference],
        [copyText.receiptStatus, item.status === "resubmit" ? copyText.statusResubmit : copyText.statusSubmit],
        [copyText.name, item.customerName],
        [copyText.account, item.accountNumber],
        [copyText.from, formatIso(item.fromDate)],
        [copyText.to, formatIso(item.toDate)],
        [copyText.balance, item.totalBalance],
        [copyText.charges, money(SERVICE_CHARGE, "MMK")],
        [copyText.feeAccount, item.chargeAccount],
        [copyText.remark, item.remark]
      ];
      if (channelName) rows.push([copyText.receiptChannel, `${channelName} · ${channelValue}`]);
      return rows;
    }

    function bankDetail(copyText) {
      const item = state.bankHistory.find((entry) => entry.reference === state.bankHistoryDetail);
      if (!item) {
        state.bankView = "history";
        return bankHistory(copyText);
      }
      const list = bankDetailRows(item, copyText).map(([label, value]) =>
        `<div class="confirm-row"><span>${escapeHtml(label)}</span><strong>${escapeHtml(value || "—")}</strong></div>`
      ).join("");
      const primary = accountByNumber(item.accountNumber);
      const draft = { fromDate: item.fromDate, toDate: item.toDate, remark: item.remark || "" };
      const preview = primary && item.fromDate && item.toDate
        ? bankFilePreviewHtml(primary, draft, { notice: false, download: true, fileName: bankReceiptFileName(item) })
        : "";
      return `
        <div class="page-top">${backButton("bank-detail-back")}</div>
        <section class="embassy detail-wide">
          <article class="history-card">
            <div class="confirm-head">
              <h1>${escapeHtml(copyText.detailsTitle)}</h1>
            </div>

    function bindBankHistory() {
      const home = document.getElementById("bank-home");
      if (home) {
        home.addEventListener("click", () => {
          state.bankView = "welcome";
          render();
        });
      }
      const filters = document.getElementById("bank-history-filters");
      if (filters) {
        const applyFilters = () => {
          const active = document.activeElement;
          state.bankHistoryFilterFocus = active && filters.contains(active) ? active.id : "";
          state.bankHistoryFilters.appliedFrom = filters.appliedFrom.value;
          state.bankHistoryFilters.appliedTo = filters.appliedTo.value;
          state.bankHistoryFilters.transactionRef = filters.transactionRef.value;
          state.bankHistoryFilters.accountNumber = filters.accountNumber.value;
          state.bankHistoryPage = 1;
          render();
        };
        filters.addEventListener("input", applyFilters);
        filters.addEventListener("change", applyFilters);
      }
      const clear = document.getElementById("bank-clear-filters");
      if (clear) {
        clear.addEventListener("click", () => {
          state.bankHistoryFilters = emptyBankHistoryFilters();
          state.bankHistoryFilterFocus = "";
          state.bankHistoryPage = 1;
          render();
        });
      }
      document.querySelectorAll(".history-pager [data-page]").forEach((btn) => {
        btn.addEventListener("click", () => {
          if (btn.disabled) return;
          state.bankHistoryPage = Number(btn.dataset.page);
          render();
        });
      });
      document.querySelectorAll("[data-bank-detail]").forEach((btn) => {
        btn.addEventListener("click", () => {
          state.bankHistoryDetail = btn.dataset.bankDetail;
          state.bankView = "detail";
          render();
        });
      });
      if (state.bankHistoryFilterFocus && state.bankHistoryFilterFocus !== "bank-filter-from" && state.bankHistoryFilterFocus !== "bank-filter-to") {
        const field = document.getElementById(state.bankHistoryFilterFocus);
        if (field) {
          field.focus();
          const end = field.value.length;
          if (field.setSelectionRange && field.type !== "date") field.setSelectionRange(end, end);
        }
      }
    }

    function bindBankDetail() {
      const back = document.getElementById("bank-detail-back");
      if (!back) {
        bindBankHistory();
        return;
      }
      bindBankFilePreview();
      const download = document.getElementById("detail-download");
      if (download) {
        download.addEventListener("click", () => {
          const item = state.bankHistory.find((entry) => entry.reference === state.bankHistoryDetail);
          downloadBankStatementFile(item);
        });
      }
      back.addEventListener("click", () => {
        state.bankView = "history";
        render();
      });

    function openBankForm() {
      state.bankView = "form";
      state.bankAlerts = [];
      state.bankFieldErrors = {};
      render();

    function bankFieldClass(name) {
      return state.bankFieldErrors[name] ? " invalid" : "";
    }

    function bankChargeIssues(account) {
      if (!account || account.balance >= SERVICE_CHARGE) return [];
      return ["msg008"];
    }

    function bankInquiryBlocked() {
      const charge = resolvedCharge(state.bankDraft);
      return !!(charge && bankChargeIssues(charge).length);
    }

    function bankVisibleAlerts() {
      const text = bankCopy();
      const alerts = [...state.bankAlerts];
      const charge = resolvedCharge(state.bankDraft);
      if (charge) {
        bankChargeIssues(charge).forEach((key) => {
          if (!alerts.includes(key)) alerts.push(key);
        });
      }
      return alerts.map((key) => text[key]).filter(Boolean);
    }

      const text = bankCopy();
      const draft = state.bankDraft;
      const primary = accountById(draft.account);
      const charge = resolvedCharge(draft);
      const yesterday = yesterdayIso();
      const fromMax = draft.toDate && draft.toDate <= yesterday ? draft.toDate : yesterday;
      const accounts = statementAccounts().map((item) => accountOption(item, draft.account)).join("");
      const feeChoices = lcyChargeAccounts().map((item) => accountOption(item, charge ? charge.id : "")).join("");

        ? `<div class="form-alert span-2" role="alert">${alerts.map((line) => `<p>${escapeHtml(line)}</p>`).join("")}</div>`
        : "";
      const feeDisabled = !primary || primary.type === "LCY";
      const feeHint = !primary ? text.feeWait : primary.type === "LCY" ? text.feeLcy : text.feeFcy;
      const openedHint = primary ? `<span class="hint">${text.opened} ${formatIso(primary.opened)}</span>` : "";
